<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AWS Quiz Categories</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Marked.js for rendering markdown explanations -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
      .explanation-content h1,
      .explanation-content h2,
      .explanation-content h3 {
        font-weight: 700;
        margin-top: 0.75rem;
        margin-bottom: 0.25rem;
        color: #f59e0b;
      }
      .explanation-content strong {
        color: #f1f5f9;
      }
      .explanation-content ul {
        list-style-type: disc;
        padding-left: 1.25rem;
        margin-top: 0.5rem;
        margin-bottom: 0.5rem;
      }
      .explanation-content p {
        margin-bottom: 0.5rem;
        line-height: 1.5;
      }
    </style>
  </head>
  <body
    class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans"
  >
    <!-- Header Navigation & Selectors -->
    <header class="bg-slate-800 border-b border-slate-700 p-4 shadow-md">
      <div
        class="max-w-5xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4"
      >
        <!-- Navigation Link to Full Practice Exams -->
        <a
          href="index.html"
          class="text-s bg-slate-700 hover:bg-slate-600 border border-slate-600 text-amber-300 font-medium px-3 py-1.5 rounded transition"
        >
          📋 Full Practice Exams
        </a>

        <div class="flex items-center gap-4">
          <h1 class="text-2xl font-bold text-amber-400">AWS Category Quiz</h1>
        </div>

        <div class="flex flex-wrap items-center gap-3">
          <div>
            <label
              for="providerSelect"
              class="text-xs text-slate-400 block mb-1"
              >Provider Source:</label
            >
            <select
              id="providerSelect"
              class="bg-slate-700 text-slate-100 px-3 py-1.5 rounded border border-slate-600 focus:outline-none focus:border-amber-400"
            >
              <option value="Ditectrev">Ditectrev</option>
              <option value="kananinirav_1">kananinirav_1</option>
              <option value="kananinirav_2">kananinirav_2</option>
            </select>
          </div>

          <div>
            <label
              for="categorySelect"
              class="text-xs text-slate-400 block mb-1"
              >Select Domain/Category:</label
            >
            <select
              id="categorySelect"
              class="bg-slate-700 text-slate-100 px-3 py-1.5 rounded border border-slate-600 focus:outline-none focus:border-amber-400"
            >
              <option value="1-cloud-concepts.json">1. Cloud Concepts</option>
              <option value="2-security-and-compliance.json">
                2. Security & Compliance
              </option>
              <option value="3-cloud-technology-services.json" id="opt-tech">
                3. Cloud Technology & Services
              </option>
              <option value="4-billing-pricing-and-support.json">
                4. Billing, Pricing & Support
              </option>
            </select>
          </div>

          <div class="self-end">
            <button
              id="loadBtn"
              class="bg-amber-500 hover:bg-amber-600 text-slate-900 font-semibold px-4 py-1.5 rounded transition cursor-pointer"
            >
              Start Quiz
            </button>
          </div>
        </div>
      </div>
    </header>

    <!-- Main App Body -->
    <main class="flex-grow max-w-4xl w-full mx-auto p-4 md:p-6">
      <!-- Question & Score Progress Bar -->
      <div
        id="progressTracker"
        class="hidden mb-6 flex justify-between items-center bg-slate-800 p-4 rounded-lg border border-slate-700"
      >
        <span id="questionCount" class="text-slate-300 font-medium"
          >Question 1 of 10</span
        >
        <span id="scoreTracker" class="text-amber-400 font-semibold"
          >Score: 0</span
        >
      </div>

      <!-- Interactive Question Card -->
      <div
        id="quizCard"
        class="bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-xl hidden"
      >
        <div
          id="questionText"
          class="text-lg font-medium text-slate-100 mb-6 leading-relaxed"
        ></div>

        <div id="optionsContainer" class="space-y-3 mb-6"></div>

        <!-- Toolbar Action Buttons -->
        <div
          class="flex flex-wrap justify-between items-center gap-4 pt-4 border-t border-slate-700"
        >
          <!-- Left-Side Controls (Previous & Explain) -->
          <div class="flex items-center gap-3">
            <button
              id="prevBtn"
              class="bg-slate-700 hover:bg-slate-600 text-slate-200 px-4 py-2 rounded font-medium transition hidden cursor-pointer"
            >
              ← Previous
            </button>
            <button
              id="explainBtn"
              class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded font-medium transition hidden flex items-center gap-2 cursor-pointer"
            >
              💡 <span>Explain</span>
            </button>
          </div>

          <!-- Right-Side Controls (Submit & Next) -->
          <div class="flex items-center gap-3 ml-auto">
            <button
              id="submitBtn"
              disabled
              class="bg-slate-600 text-slate-400 cursor-not-allowed font-bold px-6 py-2 rounded transition"
            >
              Submit
            </button>
            <button
              id="nextBtn"
              class="bg-amber-500 hover:bg-amber-600 text-slate-900 font-bold px-6 py-2 rounded transition hidden cursor-pointer"
            >
              Next Question →
            </button>
          </div>
        </div>

        <!-- Markdown Explanation Panel -->
        <div
          id="explanationContainer"
          class="mt-6 p-5 bg-slate-900 border border-indigo-900/50 rounded-lg text-slate-300 text-sm hidden space-y-2 explanation-content shadow-inner"
        ></div>
      </div>

      <!-- Initial Placeholder State -->
      <div
        id="emptyState"
        class="text-center py-20 bg-slate-800/50 rounded-xl border border-dashed border-slate-700"
      >
        <p class="text-slate-400 text-lg">
          Select a Provider and Category above, then click
          <strong class="text-amber-400">Start Quiz</strong> to load questions.
        </p>
      </div>

      <!-- Final Results Summary Card -->
      <div
        id="summaryCard"
        class="bg-slate-800 p-8 rounded-xl border border-slate-700 text-center hidden"
      >
        <h2 class="text-3xl font-bold text-amber-400 mb-2">Quiz Completed!</h2>
        <p class="text-slate-300 text-lg mb-6" id="finalScoreText"></p>
        <button
          onclick="location.reload()"
          class="bg-amber-500 hover:bg-amber-600 text-slate-900 font-bold px-6 py-2.5 rounded transition cursor-pointer"
        >
          Try Another Domain
        </button>
      </div>
    </main>

    <!-- JavaScript Application Logic -->
    <script>
  let questions = [];
  let userState = [];
  let currentIndex = 0;
  let score = 0;

  const STORAGE_KEY_PROGRESS = "aws_category_quiz_progress";

  const providerSelect = document.getElementById("providerSelect");
  const categorySelect = document.getElementById("categorySelect");
  const loadBtn = document.getElementById("loadBtn");
  const quizCard = document.getElementById("quizCard");
  const emptyState = document.getElementById("emptyState");
  const summaryCard = document.getElementById("summaryCard");
  const questionText = document.getElementById("questionText");
  const optionsContainer = document.getElementById("optionsContainer");
  const prevBtn = document.getElementById("prevBtn");
  const explainBtn = document.getElementById("explainBtn");
  const submitBtn = document.getElementById("submitBtn");
  const nextBtn = document.getElementById("nextBtn");
  const explanationContainer = document.getElementById("explanationContainer");
  const progressTracker = document.getElementById("progressTracker");
  const questionCount = document.getElementById("questionCount");
  const scoreTracker = document.getElementById("scoreTracker");

  // Dynamic Storage Key Helper
  function getStorageKey() {
    const provider = providerSelect.value;
    const category = categorySelect.value;
    return `aws_cat_progress_${provider}_${category}`;
  }
  // Save current progress, score, and individual question answer states to localStorage
  function saveProgress() {
    const progress = {
      provider: providerSelect.value,
      categoryFile: categorySelect.value,
      index: currentIndex,
      score: score,
      userState: userState
    };
    localStorage.setItem(getStorageKey(), JSON.stringify(progress));
  }

function loadSavedProgress(provider, category) {
  const key = `aws_cat_progress_${provider}_${category}`;
  const stored = localStorage.getItem(key);
  return stored ? JSON.parse(stored) : null;
}

// When changing Provider or Category dropdowns, load that specific category's saved progress
providerSelect.addEventListener("change", handleCategoryChange);
categorySelect.addEventListener("change", handleCategoryChange);

function handleCategoryChange() {
  const techOpt = document.getElementById("opt-tech");
  if (providerSelect.value.startsWith("kananinirav")) {
    techOpt.value = "3-cloud-technology-and-services.json";
  } else {
    techOpt.value = "3-cloud-technology-services.json";
  }

  // Load saved progress for the newly selected domain
  const saved = loadSavedProgress(providerSelect.value, categorySelect.value);
  if (saved) {
    score = saved.score || 0;
    loadQuizData(saved.index || 0, saved.userState || null);
  } else {
    score = 0;
    loadQuizData(0, null);
  }
}

  // Clicking "Start Quiz" manually resets state and starts fresh
  loadBtn.addEventListener("click", () => {
    localStorage.removeItem(getStorageKey());
    score = 0;
    loadQuizData(0, null);
  });

  async function loadQuizData(restoreIndex = 0, savedState = null) {
    const provider = providerSelect.value;
    const file = categorySelect.value;
    const filePath = `exams/catgories/${provider}/${file}`;

    try {
      const response = await fetch(filePath);
      if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);

      questions = await response.json();

      if (!questions || questions.length === 0) {
        alert("No questions found in this category file.");
        return;
      }

      currentIndex = restoreIndex;

      // Restore saved question states if available; otherwise initialize defaults
      if (savedState && savedState.length === questions.length) {
        userState = savedState;
      } else {
        userState = questions.map(() => ({
          selectedIndices: [],
          isSubmitted: false,
          isCorrect: false,
          visitedBefore: false
        }));
      }

      emptyState.classList.add("hidden");
      summaryCard.classList.add("hidden");
      quizCard.classList.remove("hidden");
      progressTracker.classList.remove("hidden");

      displayQuestion();
    } catch (error) {
      console.error("Error fetching data:", error);
      alert(`Failed to load file: ${filePath}. Please check server routing.`);
    }
  }

  function displayQuestion() {
  resetState();

  const q = questions[currentIndex];
  const state = userState[currentIndex];

  questionCount.textContent = `Question ${currentIndex + 1} of ${questions.length}`;
  scoreTracker.textContent = `Score: ${score}`;
  questionText.textContent = q.question;

  // Previous Button Visibility
  if (currentIndex > 0) {
    prevBtn.classList.remove("hidden");
  } else {
    prevBtn.classList.add("hidden");
  }

  // Show 'Next' ONLY if the current question has been submitted
  if (state.isSubmitted) {
    nextBtn.classList.remove("hidden");
  } else {
    nextBtn.classList.add("hidden");
  }

  // Mark as visited for tracking
  state.visitedBefore = true;

  q.options.forEach((optStr, idx) => {
    const btn = document.createElement("button");
    btn.className =
      "option-btn w-full text-left p-3.5 rounded-lg border border-slate-700 bg-slate-700/50 hover:bg-slate-700 text-slate-200 transition flex items-center gap-3 cursor-pointer";
    btn.innerHTML = `<span class="font-semibold text-amber-400">${optStr.substring(0, 2)}</span> <span>${optStr.substring(3)}</span>`;
    btn.addEventListener("click", () => handleOptionSelect(idx));
    optionsContainer.appendChild(btn);
  });

  if (state.isSubmitted) {
    restoreSubmittedQuestion();
  } else if (state.selectedIndices.length > 0) {
    updateOptionHighlights();
  }

  saveProgress();
}
   

  function handleOptionSelect(optionIdx) {
    const state = userState[currentIndex];
    if (state.isSubmitted) return;

    const q = questions[currentIndex];
    const isMultipleChoice = q.correct.length > 1;

    if (isMultipleChoice) {
      if (state.selectedIndices.includes(optionIdx)) {
        state.selectedIndices = state.selectedIndices.filter((i) => i !== optionIdx);
      } else {
        state.selectedIndices.push(optionIdx);
      }
    } else {
      state.selectedIndices = [optionIdx];
    }

    updateOptionHighlights();
    saveProgress();
  }

  function updateOptionHighlights() {
    const state = userState[currentIndex];

    Array.from(optionsContainer.children).forEach((child, idx) => {
      if (state.selectedIndices.includes(idx)) {
        child.classList.add("border-amber-400", "bg-slate-700", "ring-2", "ring-amber-400/50");
      } else {
        child.classList.remove("border-amber-400", "bg-slate-700", "ring-2", "ring-amber-400/50");
      }
    });

    if (state.selectedIndices.length > 0) {
      submitBtn.disabled = false;
      submitBtn.className =
        "bg-amber-500 hover:bg-amber-600 text-slate-900 font-bold px-6 py-2 rounded transition cursor-pointer";
    } else {
      submitBtn.disabled = true;
      submitBtn.className =
        "bg-slate-600 text-slate-400 cursor-not-allowed font-bold px-6 py-2 rounded transition";
    }
  }

  submitBtn.addEventListener("click", () => {
    const state = userState[currentIndex];
    if (state.selectedIndices.length === 0 || state.isSubmitted) return;

    state.isSubmitted = true;
    const q = questions[currentIndex];

    const isCorrect =
      state.selectedIndices.length === q.correct.length &&
      state.selectedIndices.every((val) => q.correct.includes(val));

    state.isCorrect = isCorrect;

    if (isCorrect) {
      score++;
      scoreTracker.textContent = `Score: ${score}`;
    }

    saveProgress();
    restoreSubmittedQuestion();
  });

  function restoreSubmittedQuestion() {
    const q = questions[currentIndex];
    const state = userState[currentIndex];

    Array.from(optionsContainer.children).forEach((child, idx) => {
      child.disabled = true;
      child.classList.remove("ring-2", "ring-amber-400/50", "hover:bg-slate-700", "cursor-pointer");
      child.classList.add("cursor-not-allowed", "opacity-90");

      if (q.correct.includes(idx)) {
        child.classList.remove("bg-slate-700/50", "border-slate-700", "border-amber-400");
        child.classList.add("bg-emerald-950", "border-emerald-500", "text-emerald-200");
      } else if (state.selectedIndices.includes(idx)) {
        child.classList.remove("bg-slate-700/50", "border-slate-700", "border-amber-400");
        child.classList.add("bg-rose-950", "border-rose-500", "text-rose-200");
      }
    });

    submitBtn.classList.add("hidden");
    explainBtn.classList.remove("hidden");
    nextBtn.classList.remove("hidden");
  }

  prevBtn.addEventListener("click", () => {
    if (currentIndex > 0) {
      currentIndex--;
      displayQuestion();
    }
  });

  nextBtn.addEventListener("click", () => {
    if (currentIndex < questions.length - 1) {
      currentIndex++;
      displayQuestion();
    } else {
      showSummary();
    }
  });

  explainBtn.addEventListener("click", () => {
    const q = questions[currentIndex];

    if (explanationContainer.classList.contains("hidden")) {
      const rawMarkdown =
        q.explanation || "No detailed explanation is available for this question.";
      explanationContainer.innerHTML = marked.parse(rawMarkdown);
      explanationContainer.classList.remove("hidden");
    } else {
      explanationContainer.classList.add("hidden");
    }
  });

  function resetState() {
    optionsContainer.innerHTML = "";
    explanationContainer.innerHTML = "";
    explanationContainer.classList.add("hidden");
    explainBtn.classList.add("hidden");

    submitBtn.classList.remove("hidden");
    submitBtn.disabled = true;
    submitBtn.className =
      "bg-slate-600 text-slate-400 cursor-not-allowed font-bold px-6 py-2 rounded transition";
  }

  function showSummary() {
    quizCard.classList.add("hidden");
    progressTracker.classList.add("hidden");
    summaryCard.classList.remove("hidden");

    const percentage = Math.round((score / questions.length) * 100);
    document.getElementById("finalScoreText").innerHTML =
      `You scored <span class="text-amber-400 font-bold">${score}</span> out of <span class="font-bold">${questions.length}</span> (${percentage}%).`;
  }

  function initApp() {
    const saved = loadSavedProgress();
    if (saved) {
      providerSelect.value = saved.provider;
      const techOpt = document.getElementById("opt-tech");
      if (saved.provider.startsWith("kananinirav")) {
        techOpt.value = "3-cloud-technology-and-services.json";
      } else {
        techOpt.value = "3-cloud-technology-services.json";
      }
      categorySelect.value = saved.categoryFile;
      score = saved.score || 0;

      loadQuizData(saved.index || 0, saved.userState || null);
    }
  }

  function resetAllQuizData() {
  if (confirm("Are you sure you want to clear all saved progress across all categories?")) {
    Object.keys(localStorage)
      .filter(key => key.startsWith("aws_cat_progress_") || key.startsWith("aws_exam_progress_"))
      .forEach(key => localStorage.removeItem(key));
    location.reload();
  }
}

  initApp();
</script>
  </body>
</html>

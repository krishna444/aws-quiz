<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AWS Quiz Categories</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
      .explanation-content h1,
      .explanation-content h2,
      .explanation-content h3 {
        font-weight: 700;
        margin-top: 0.75rem;
        margin-bottom: 0.25rem;
        color: #f59e0b;
      }
      .explanation-content strong {
        color: #f1f5f9;
      }
      .explanation-content ul {
        list-style-type: disc;
        padding-left: 1.25rem;
        margin-top: 0.5rem;
        margin-bottom: 0.5rem;
      }
      .explanation-content p {
        margin-bottom: 0.5rem;
        line-height: 1.5;
      }
    </style>
  </head>
  <body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">
    <header class="bg-slate-800 border-b border-slate-700 p-4 shadow-md">
      <div class="max-w-6xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
        <a
          href="index.html"
          class="text-s bg-slate-700 hover:bg-slate-600 border border-slate-600 text-amber-300 font-medium px-3 py-1.5 rounded transition"
        >
          📋 Full Practice Exams
        </a>

        <div class="flex items-center gap-4">
          <h1 class="text-2xl font-bold text-amber-400">AWS Category Quiz</h1>
        </div>

        <div class="flex flex-wrap items-center gap-3">
          <!-- 1. Certification Level -->
          <div>
            <label for="certSelect" class="text-xs text-slate-400 block mb-1">Certification:</label>
            <select
              id="certSelect"
              class="bg-slate-700 text-slate-100 px-3 py-1.5 rounded border border-slate-600 focus:outline-none focus:border-amber-400"
            >
              <option value="clf-c02" selected>AWS CLF-C02</option>
              <option value="saa-c03">AWS SAA-C03</option>
            </select>
          </div>

          <!-- 2. Provider Source -->
          <div>
            <label for="providerSelect" class="text-xs text-slate-400 block mb-1">Provider Source:</label>
            <select
              id="providerSelect"
              class="bg-slate-700 text-slate-100 px-3 py-1.5 rounded border border-slate-600 focus:outline-none focus:border-amber-400"
            ></select>
          </div>

          <!-- 3. Dynamic Sub-Set Selector (Hidden if Provider has no subfolders) -->
          <div id="subSetWrapper" class="hidden">
            <label for="subSetSelect" class="text-xs text-slate-400 block mb-1">Set / Variation:</label>
            <select
              id="subSetSelect"
              class="bg-slate-700 text-slate-100 px-3 py-1.5 rounded border border-slate-600 focus:outline-none focus:border-amber-400"
            ></select>
          </div>

          <!-- 4. Category / Domain -->
          <div>
            <label for="categorySelect" class="text-xs text-slate-400 block mb-1">Select Domain/Category:</label>
            <select
              id="categorySelect"
              class="bg-slate-700 text-slate-100 px-3 py-1.5 rounded border border-slate-600 focus:outline-none focus:border-amber-400"
            ></select>
          </div>

          <div class="self-end">
            <button
              id="loadBtn"
              class="bg-amber-500 hover:bg-amber-600 text-slate-900 font-semibold px-4 py-1.5 rounded transition cursor-pointer"
            >
              Start Quiz
            </button>
          </div>
        </div>
      </div>
    </header>

    <main class="flex-grow max-w-4xl w-full mx-auto p-4 md:p-6">
      <div
        id="progressTracker"
        class="hidden mb-6 flex justify-between items-center bg-slate-800 p-4 rounded-lg border border-slate-700"
      >
        <span id="questionCount" class="text-slate-300 font-medium">Question 1 of 10</span>
        <span id="scoreTracker" class="text-amber-400 font-semibold">Score: 0</span>
      </div>

      <div id="quizCard" class="bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-xl hidden">
        <div id="questionText" class="text-lg font-medium text-slate-100 mb-6 leading-relaxed"></div>
        <div id="optionsContainer" class="space-y-3 mb-6"></div>

        <div class="flex flex-wrap justify-between items-center gap-4 pt-4 border-t border-slate-700">
          <div class="flex items-center gap-3">
            <button
              id="prevBtn"
              class="bg-slate-700 hover:bg-slate-600 text-slate-200 px-4 py-2 rounded font-medium transition hidden cursor-pointer"
            >
              ← Previous
            </button>
            <button
              id="explainBtn"
              class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded font-medium transition hidden flex items-center gap-2 cursor-pointer"
            >
              💡 <span>Explain</span>
            </button>
          </div>

          <div class="flex items-center gap-3 ml-auto">
            <button
              id="submitBtn"
              disabled
              class="bg-slate-600 text-slate-400 cursor-not-allowed font-bold px-6 py-2 rounded transition"
            >
              Submit
            </button>
            <button
              id="nextBtn"
              class="bg-amber-500 hover:bg-amber-600 text-slate-900 font-bold px-6 py-2 rounded transition hidden cursor-pointer"
            >
              Next Question →
            </button>
          </div>
        </div>

        <div
          id="explanationContainer"
          class="mt-6 p-5 bg-slate-900 border border-indigo-900/50 rounded-lg text-slate-300 text-sm hidden space-y-2 explanation-content shadow-inner"
        ></div>
      </div>

      <div
        id="emptyState"
        class="text-center py-20 bg-slate-800/50 rounded-xl border border-dashed border-slate-700"
      >
        <p class="text-slate-400 text-lg">
          Select a Certification, Provider, and Category above, then click
          <strong class="text-amber-400">Start Quiz</strong> to load questions.
        </p>
      </div>

      <div id="summaryCard" class="bg-slate-800 p-8 rounded-xl border border-slate-700 text-center hidden">
        <h2 class="text-3xl font-bold text-amber-400 mb-2">Quiz Completed!</h2>
        <p class="text-slate-300 text-lg mb-6" id="finalScoreText"></p>
        <button
          onclick="location.reload()"
          class="bg-amber-500 hover:bg-amber-600 text-slate-900 font-bold px-6 py-2.5 rounded transition cursor-pointer"
        >
          Try Another Domain
        </button>
      </div>
    </main>

    <script>
      let questions = [];
      let userState = [];
      let currentIndex = 0;
      let score = 0;

      // Schema mapping matching directory layout
      const CONFIG_MAP = {
        'clf-c02': {
          providers: {
            'kananinirav': {
              subSets: ['kananinirav_1', 'kananinirav_2'],
              defaultSubSet: 'kananinirav_1',
              categories: [
                { value: "1-cloud-concepts.json", label: "1. Cloud Concepts" },
                { value: "2-security-and-compliance.json", label: "2. Security & Compliance" },
                { value: "3-cloud-technology-and-services.json", label: "3. Cloud Technology & Services" },
                { value: "4-billing-pricing-and-support.json", label: "4. Billing, Pricing & Support" }
              ]
            },
            'Ditectrev': {
              subSets: [],
              categories: [
                { value: "1-cloud-concepts.json", label: "1. Cloud Concepts" },
                { value: "2-security-and-compliance.json", label: "2. Security & Compliance" },
                { value: "3-cloud-technology-services.json", label: "3. Cloud Technology & Services" },
                { value: "4-billing-pricing-and-support.json", label: "4. Billing, Pricing & Support" }
              ]
            }
          },
          defaultProvider: 'kananinirav'
        },
        'saa-c03': {
          providers: {
            'Ditectrev': {
              subSets: [],
              categories: [
                { value: "1-secure-architectures.json", label: "1. Secure Architectures" },
                { value: "2-resilient-architectures.json", label: "2. Resilient Architectures" },                
                { value: "3-high-performance-architectures.json", label: "3. High-Performance Architectures" },
                { value: "4-cost-optimized-architectures.json", label: "4. Cost-Optimized Architectures" }
              ]
            },
            'kananinirav': {
              subSets: ['kananinirav_1'],
              defaultSubSet: 'kananinirav_1',
              categories: [
                { value: "1-secure-architectures.json", label: "1. Secure Architectures" },
                { value: "2-resilient-architectures.json", label: "2. Resilient Architectures" },                
                { value: "3-high-performance-architectures.json", label: "3. High-Performance Architectures" },
                { value: "4-cost-optimized-architectures.json", label: "4. Cost-Optimized Architectures" }
              ]
            }
          },
          defaultProvider: 'Ditectrev'
        }
      };

      const STORAGE_KEY_LAST_CAT_SESSION = "aws_cat_last_session";

      const certSelect = document.getElementById("certSelect");
      const providerSelect = document.getElementById("providerSelect");
      const subSetWrapper = document.getElementById("subSetWrapper");
      const subSetSelect = document.getElementById("subSetSelect");
      const categorySelect = document.getElementById("categorySelect");
      const loadBtn = document.getElementById("loadBtn");
      const quizCard = document.getElementById("quizCard");
      const emptyState = document.getElementById("emptyState");
      const summaryCard = document.getElementById("summaryCard");
      const questionText = document.getElementById("questionText");
      const optionsContainer = document.getElementById("optionsContainer");
      const prevBtn = document.getElementById("prevBtn");
      const explainBtn = document.getElementById("explainBtn");
      const submitBtn = document.getElementById("submitBtn");
      const nextBtn = document.getElementById("nextBtn");
      const explanationContainer = document.getElementById("explanationContainer");
      const progressTracker = document.getElementById("progressTracker");
      const questionCount = document.getElementById("questionCount");
      const scoreTracker = document.getElementById("scoreTracker");

      function getStorageKey() {
        const cert = certSelect.value;
        const provider = providerSelect.value;
        const subSet = subSetSelect.value || "none";
        const category = categorySelect.value;
        return `aws_cat_progress_${cert}_${provider}_${subSet}_${category}`;
      }

      function saveProgress() {
        const sessionInfo = {
          cert: certSelect.value,
          provider: providerSelect.value,
          subSet: subSetSelect.value || "",
          categoryFile: categorySelect.value
        };
        localStorage.setItem(STORAGE_KEY_LAST_CAT_SESSION, JSON.stringify(sessionInfo));

        const progress = {
          cert: certSelect.value,
          provider: providerSelect.value,
          subSet: subSetSelect.value || "",
          categoryFile: categorySelect.value,
          index: currentIndex,
          score: score,
          userState: userState
        };
        localStorage.setItem(getStorageKey(), JSON.stringify(progress));
      }

      function loadSavedProgress(cert, provider, subSet, category) {
        const sub = subSet || "none";
        const key = `aws_cat_progress_${cert}_${provider}_${sub}_${category}`;
        const stored = localStorage.getItem(key);
        return stored ? JSON.parse(stored) : null;
      }

      function renderDropdowns() {
        const cert = certSelect.value;
        const certData = CONFIG_MAP[cert];
        
        // Populate Providers
        providerSelect.innerHTML = "";
        Object.keys(certData.providers).forEach(p => {
          const opt = document.createElement("option");
          opt.value = p;
          opt.textContent = p;
          providerSelect.appendChild(opt);
        });

        if (!providerSelect.value || !certData.providers[providerSelect.value]) {
          providerSelect.value = certData.defaultProvider;
        }

        renderSubSetAndCategories();
      }

      function renderSubSetAndCategories() {
        const cert = certSelect.value;
        const provider = providerSelect.value;
        const providerData = CONFIG_MAP[cert].providers[provider];

        if (!providerData) return;

        // Populate Sub-Sets if available
        if (providerData.subSets && providerData.subSets.length > 0) {
          subSetWrapper.classList.remove("hidden");
          subSetSelect.innerHTML = "";
          providerData.subSets.forEach(sub => {
            const opt = document.createElement("option");
            opt.value = sub;
            opt.textContent = sub;
            subSetSelect.appendChild(opt);
          });
          if (providerData.defaultSubSet) {
            subSetSelect.value = providerData.defaultSubSet;
          }
        } else {
          subSetWrapper.classList.add("hidden");
          subSetSelect.innerHTML = "";
        }

        // Populate Categories
        categorySelect.innerHTML = "";
        providerData.categories.forEach(cat => {
          const opt = document.createElement("option");
          opt.value = cat.value;
          opt.textContent = cat.label;
          categorySelect.appendChild(opt);
        });
      }

      certSelect.addEventListener("change", () => {
        renderDropdowns();
        handleSelectionChange();
      });

      providerSelect.addEventListener("change", () => {
        renderSubSetAndCategories();
        handleSelectionChange();
      });

      subSetSelect.addEventListener("change", handleSelectionChange);
      categorySelect.addEventListener("change", handleSelectionChange);

      function handleSelectionChange() {
        const saved = loadSavedProgress(
          certSelect.value,
          providerSelect.value,
          subSetSelect.value,
          categorySelect.value
        );

        if (saved) {
          score = saved.score || 0;
          loadQuizData(saved.index || 0, saved.userState || null);
        } else {
          score = 0;
          loadQuizData(0, null);
        }
      }

      loadBtn.addEventListener("click", () => {
        localStorage.removeItem(getStorageKey());
        score = 0;
        loadQuizData(0, null);
      });

      async function loadQuizData(restoreIndex = 0, savedState = null) {
        const cert = certSelect.value;
        const provider = providerSelect.value;
        const subSet = subSetSelect.value;
        const file = categorySelect.value;

        // Path mapped to /categories/ directory (supports nested sub-sets)
        let filePath = `exams/${cert}/${provider}/categories/`;
        if (subSet) {
          filePath += `${subSet}/${file}`;
        } else {
          filePath += `${file}`;
        }

        try {
          const response = await fetch(filePath);
          if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);

          questions = await response.json();
          currentIndex = restoreIndex;

          if (savedState && savedState.length === questions.length) {
            userState = savedState;
          } else {
            userState = questions.map(() => ({
              selectedIndices: [],
              isSubmitted: false,
              isCorrect: false,
              visitedBefore: false
            }));
          }

          emptyState.classList.add("hidden");
          summaryCard.classList.add("hidden");
          quizCard.classList.remove("hidden");
          progressTracker.classList.remove("hidden");

          displayQuestion();
        } catch (error) {
          console.error("Error fetching data:", error);
          alert(`Failed to load file: ${filePath}. Please check path.`);
        }
      }

      function displayQuestion() {
        resetState();

        const q = questions[currentIndex];
        const state = userState[currentIndex];

        questionCount.textContent = `Question ${currentIndex + 1} of ${questions.length}`;
        scoreTracker.textContent = `Score: ${score}`;
        questionText.textContent = q.question;

        if (currentIndex > 0) {
          prevBtn.classList.remove("hidden");
        } else {
          prevBtn.classList.add("hidden");
        }

        if (state.isSubmitted) {
          nextBtn.classList.remove("hidden");
        } else {
          nextBtn.classList.add("hidden");
        }

        state.visitedBefore = true;

        q.options.forEach((optStr, idx) => {
          const btn = document.createElement("button");
          btn.className =
            "option-btn w-full text-left p-3.5 rounded-lg border border-slate-700 bg-slate-700/50 hover:bg-slate-700 text-slate-200 transition flex items-center gap-3 cursor-pointer";
          btn.innerHTML = `<span class="font-semibold text-amber-400">${optStr.substring(0, 2)}</span> <span>${optStr.substring(3)}</span>`;
          btn.addEventListener("click", () => handleOptionSelect(idx));
          optionsContainer.appendChild(btn);
        });

        if (state.isSubmitted) {
          restoreSubmittedQuestion();
        } else if (state.selectedIndices.length > 0) {
          updateOptionHighlights();
        }

        saveProgress();
      }

      function handleOptionSelect(optionIdx) {
        const state = userState[currentIndex];
        if (state.isSubmitted) return;

        const q = questions[currentIndex];
        const isMultipleChoice = q.correct.length > 1;

        if (isMultipleChoice) {
          if (state.selectedIndices.includes(optionIdx)) {
            state.selectedIndices = state.selectedIndices.filter((i) => i !== optionIdx);
          } else {
            state.selectedIndices.push(optionIdx);
          }
        } else {
          state.selectedIndices = [optionIdx];
        }

        updateOptionHighlights();
        saveProgress();
      }

      function updateOptionHighlights() {
        const state = userState[currentIndex];

        Array.from(optionsContainer.children).forEach((child, idx) => {
          if (state.selectedIndices.includes(idx)) {
            child.classList.add("border-amber-400", "bg-slate-700", "ring-2", "ring-amber-400/50");
          } else {
            child.classList.remove("border-amber-400", "bg-slate-700", "ring-2", "ring-amber-400/50");
          }
        });

        if (state.selectedIndices.length > 0) {
          submitBtn.disabled = false;
          submitBtn.className =
            "bg-amber-500 hover:bg-amber-600 text-slate-900 font-bold px-6 py-2 rounded transition cursor-pointer";
        } else {
          submitBtn.disabled = true;
          submitBtn.className =
            "bg-slate-600 text-slate-400 cursor-not-allowed font-bold px-6 py-2 rounded transition";
        }
      }

      submitBtn.addEventListener("click", () => {
        const state = userState[currentIndex];
        if (state.selectedIndices.length === 0 || state.isSubmitted) return;

        state.isSubmitted = true;
        const q = questions[currentIndex];

        const isCorrect =
          state.selectedIndices.length === q.correct.length &&
          state.selectedIndices.every((val) => q.correct.includes(val));

        state.isCorrect = isCorrect;

        if (isCorrect) {
          score++;
          scoreTracker.textContent = `Score: ${score}`;
        }

        saveProgress();
        restoreSubmittedQuestion();
      });

      function restoreSubmittedQuestion() {
        const q = questions[currentIndex];
        const state = userState[currentIndex];

        Array.from(optionsContainer.children).forEach((child, idx) => {
          child.disabled = true;
          child.classList.remove("ring-2", "ring-amber-400/50", "hover:bg-slate-700", "cursor-pointer");
          child.classList.add("cursor-not-allowed", "opacity-90");

          if (q.correct.includes(idx)) {
            child.classList.remove("bg-slate-700/50", "border-slate-700", "border-amber-400");
            child.classList.add("bg-emerald-950", "border-emerald-500", "text-emerald-200");
          } else if (state.selectedIndices.includes(idx)) {
            child.classList.remove("bg-slate-700/50", "border-slate-700", "border-amber-400");
            child.classList.add("bg-rose-950", "border-rose-500", "text-rose-200");
          }
        });

        submitBtn.classList.add("hidden");
        explainBtn.classList.remove("hidden");
        nextBtn.classList.remove("hidden");
      }

      prevBtn.addEventListener("click", () => {
        if (currentIndex > 0) {
          currentIndex--;
          displayQuestion();
        }
      });

      nextBtn.addEventListener("click", () => {
        if (currentIndex < questions.length - 1) {
          currentIndex++;
          displayQuestion();
        } else {
          showSummary();
        }
      });

      explainBtn.addEventListener("click", () => {
        const q = questions[currentIndex];

        if (explanationContainer.classList.contains("hidden")) {
          const rawMarkdown =
            q.explanation || "No detailed explanation is available for this question.";
          explanationContainer.innerHTML = marked.parse(rawMarkdown);
          explanationContainer.classList.remove("hidden");
        } else {
          explanationContainer.classList.add("hidden");
        }
      });

      function resetState() {
        optionsContainer.innerHTML = "";
        explanationContainer.innerHTML = "";
        explanationContainer.classList.add("hidden");
        explainBtn.classList.add("hidden");

        submitBtn.classList.remove("hidden");
        submitBtn.disabled = true;
        submitBtn.className =
          "bg-slate-600 text-slate-400 cursor-not-allowed font-bold px-6 py-2 rounded transition";
      }

      function showSummary() {
        quizCard.classList.add("hidden");
        progressTracker.classList.add("hidden");
        summaryCard.classList.remove("hidden");

        const percentage = Math.round((score / questions.length) * 100);
        document.getElementById("finalScoreText").innerHTML =
          `You scored <span class="text-amber-400 font-bold">${score}</span> out of <span class="font-bold">${questions.length}</span> (${percentage}%).`;
      }

      function initApp() {
        const lastSession = localStorage.getItem(STORAGE_KEY_LAST_CAT_SESSION);

        if (lastSession) {
          const session = JSON.parse(lastSession);
          certSelect.value = session.cert || "clf-c02";
          renderDropdowns();

          providerSelect.value = session.provider || "kananinirav";
          renderSubSetAndCategories();

          if (session.subSet && subSetSelect) {
            subSetSelect.value = session.subSet;
          }
          if (session.categoryFile) {
            categorySelect.value = session.categoryFile;
          }

          const saved = loadSavedProgress(
            certSelect.value,
            providerSelect.value,
            subSetSelect.value,
            categorySelect.value
          );

          if (saved) {
            score = saved.score || 0;
            loadQuizData(saved.index || 0, saved.userState || null);
          } else {
            loadQuizData(0, null);
          }
        } else {
          renderDropdowns();
          handleSelectionChange();
        }
      }

      initApp();
    </script>
  </body>
</html>

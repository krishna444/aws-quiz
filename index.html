<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="styles/quiz.css" />
    <title>AWS Practice Exams</title>
  </head>
  <body>
    <div class="quiz-container">
      <div class="header">
        <a
          href="quiz_category.html"
          class="btn btn-secondary"
          style="text-decoration: none; font-size: 0.85rem; padding: 6px 12px"
        >
          📁 Category Quizzes
        </a>
      </div>
      <div class="controls-header">
        <label for="cert-select">Certification:</label>
        <select
          id="cert-select"
          class="select-dropdown"
          onchange="switchCertification(this.value)"
        >
          <option value="clf-c02" selected>AWS CLF-C02</option>
          <option value="saa-c03">AWS SAA-C03</option>
        </select>

        <label for="provider-select" style="margin-left: 15px">Provider:</label>
        <select
          id="provider-select"
          class="select-dropdown"
          onchange="switchProvider(this.value)"
        ></select>

        <label for="exam-select" style="margin-left: 15px">Practice Exam:</label>
        <select
          id="exam-select"
          class="select-dropdown"
          onchange="switchExam(this.value)"
        ></select>
      </div>

      <div id="quiz-screen">
        <div class="header">
          <h1 id="exam-title">Practice Exam</h1>
          <span class="progress" id="progress">Question 1</span>
        </div>
        <div class="question-text" id="question">Loading questions...</div>
        <div class="options-container" id="options"></div>

        <div class="explanation-box" id="explanation-box">
          <strong>Explanation:</strong>
          <span id="explanation-text"></span>
        </div>

        <div
          class="footer"
          style="
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
          "
        >
          <div
            class="left-buttons"
            style="display: flex; align-items: center; gap: 10px"
          >
            <button
              class="btn btn-secondary"
              id="prev-btn"
              onclick="prevQuestion()"
              style="display: none"
            >
              Previous
            </button>
            <button
              class="btn btn-explain"
              id="explain-btn"
              onclick="toggleExplanation()"
              style="display: none"
            >
              💡 <span> Explain </span>
            </button>
          </div>

          <button class="btn" id="action-btn" onclick="handleAction()" disabled>
            Submit Answer
          </button>
        </div>
      </div>

      <div id="score-screen" class="score-container" style="display: none">
        <h2>Quiz Completed!</h2>
        <p class="score-details" id="final-score"></p>
        <button class="btn" onclick="restartQuiz()">
          Restart Current Quiz
        </button>
      </div>
    </div>

    <script>
      const CERT_CONFIG = {
        'clf-c02': {
          providers: {
            'kananinirav': 23,
            'Ditectrev': 12
          },
          defaultProvider: 'kananinirav'
        },
        'saa-c03': {
          providers: {
            'Ditectrev': 16,
            'kananinirav': 12
          },
          defaultProvider: 'Ditectrev'
        }
      };

      let currentCert = 'clf-c02';
      let currentProvider = 'kananinirav';
      let currentExamFile = 'practice-exam-1.json';
      let quizData = [];
      let userState = [];
      let currentQuestionIndex = 0;
      let selectedIndices = [];
      let score = 0;
      let isAnswerSubmitted = false;

      const STORAGE_KEY_LAST_SESSION = "aws_quiz_last_session";

      const certSelect = document.getElementById("cert-select");
      const providerSelect = document.getElementById("provider-select");
      const examSelect = document.getElementById("exam-select");
      const examTitle = document.getElementById("exam-title");
      const questionEl = document.getElementById("question");
      const optionsEl = document.getElementById("options");
      const progressEl = document.getElementById("progress");
      const actionBtn = document.getElementById("action-btn");
      const prevBtn = document.getElementById("prev-btn");
      const explainBtn = document.getElementById("explain-btn");
      const explanationBox = document.getElementById("explanation-box");
      const explanationText = document.getElementById("explanation-text");
      const quizScreen = document.getElementById("quiz-screen");
      const scoreScreen = document.getElementById("score-screen");
      const finalScoreEl = document.getElementById("final-score");

      function getExamStorageKey(cert, provider, examFile) {
        return `aws_exam_progress_${cert}_${provider}_${examFile}`;
      }

      function saveQuizProgress() {
        const sessionInfo = {
          cert: currentCert,
          provider: currentProvider,
          examFile: currentExamFile,
        };
        localStorage.setItem(STORAGE_KEY_LAST_SESSION, JSON.stringify(sessionInfo));

        const progress = {
          cert: currentCert,
          provider: currentProvider,
          examFile: currentExamFile,
          questionIndex: currentQuestionIndex,
          score: score,
          userState: userState,
        };
        localStorage.setItem(
          getExamStorageKey(currentCert, currentProvider, currentExamFile),
          JSON.stringify(progress)
        );
      }

      function loadSavedExamProgress(cert, provider, examFile) {
        const stored = localStorage.getItem(getExamStorageKey(cert, provider, examFile));
        return stored ? JSON.parse(stored) : null;
      }

      function switchCertification(newCert) {
        currentCert = newCert;
        const certData = CERT_CONFIG[currentCert];
        
        providerSelect.innerHTML = '';
        Object.keys(certData.providers).forEach(p => {
          const opt = document.createElement('option');
          opt.value = p;
          opt.innerText = p;
          providerSelect.appendChild(opt);
        });

        currentProvider = certData.defaultProvider;
        providerSelect.value = currentProvider;

        populateExamDropdown();
        switchExam('practice-exam-1.json');
      }

      function populateExamDropdown() {
        examSelect.innerHTML = "";
        const totalExams = CERT_CONFIG[currentCert].providers[currentProvider] || 12;

        for (let i = 1; i <= totalExams; i++) {
          const opt = document.createElement("option");
          opt.value = `practice-exam-${i}.json`;
          opt.innerText = `Practice Exam - ${i}`;
          examSelect.appendChild(opt);
        }
      }

      function switchProvider(newProvider) {
        currentProvider = newProvider;
        populateExamDropdown();
        switchExam("practice-exam-1.json");
      }

      function switchExam(fileName) {
        currentExamFile = fileName;
        examSelect.value = fileName;

        const saved = loadSavedExamProgress(currentCert, currentProvider, currentExamFile);
        if (saved) {
          score = saved.score || 0;
          loadExamFile(currentExamFile, saved.questionIndex || 0, saved.userState || null);
        } else {
          score = 0;
          loadExamFile(currentExamFile, 0, null);
        }
      }

      async function loadExamFile(fileName, restoreIndex = 0, savedState = null) {
        currentExamFile = fileName;
        quizScreen.style.display = "block";
        scoreScreen.style.display = "none";
        questionEl.innerText = "Loading exam questions...";
        optionsEl.innerHTML = "";
        actionBtn.disabled = true;
        prevBtn.style.display = "none";
        explainBtn.style.display = "none";
        explanationBox.style.display = "none";

        // Path mapped to /normal/ directory
        const filePath = `exams/${currentCert}/${currentProvider}/normal/${fileName}`;

        try {
          const response = await fetch(filePath);
          if (!response.ok) throw new Error("File not found");

          quizData = await response.json();
          currentQuestionIndex = restoreIndex;

          if (savedState && savedState.length === quizData.length) {
            userState = savedState;
          } else {
            userState = quizData.map(() => ({
              selectedIndices: [],
              isSubmitted: false,
              isCorrect: false,
              visitedBefore: false,
            }));
          }

          const examNumber = fileName.replace("practice-exam-", "").replace(".json", "");
          examTitle.innerText = `[${currentCert.toUpperCase()} - ${currentProvider}] Practice Exam - ${examNumber}`;

          loadQuestion();
        } catch (err) {
          questionEl.innerText = `Error loading file: ${filePath}. Ensure the file exists.`;
        }
      }

      function loadQuestion() {
        if (quizData.length === 0 || currentQuestionIndex >= quizData.length) return;

        const state = userState[currentQuestionIndex];
        isAnswerSubmitted = state.isSubmitted;
        selectedIndices = [...state.selectedIndices];

        explainBtn.style.display = "none";
        explanationBox.style.display = "none";

        prevBtn.style.display = currentQuestionIndex > 0 ? "inline-block" : "none";

        const currentData = quizData[currentQuestionIndex];
        progressEl.innerText = `Question ${currentQuestionIndex + 1} of ${quizData.length}`;
        questionEl.innerText = currentData.question;
        optionsEl.innerHTML = "";

        currentData.options.forEach((option, index) => {
          const button = document.createElement("button");
          button.className = "option-btn";
          button.innerText = option;
          button.onclick = () => selectOption(index);
          optionsEl.appendChild(button);
        });

        if (isAnswerSubmitted) {
          restoreSubmittedState();
        } else {
          actionBtn.innerText = "Submit Answer";
          actionBtn.disabled = selectedIndices.length === 0;
          updateOptionHighlights();
        }

        state.visitedBefore = true;
        saveQuizProgress();
      }

      function selectOption(index) {
        if (isAnswerSubmitted) return;

        const currentData = quizData[currentQuestionIndex];
        const isMultiple = currentData.correct.length > 1;

        if (isMultiple) {
          if (selectedIndices.includes(index)) {
            selectedIndices = selectedIndices.filter((i) => i !== index);
          } else {
            selectedIndices.push(index);
          }
        } else {
          selectedIndices = [index];
        }

        userState[currentQuestionIndex].selectedIndices = [...selectedIndices];
        updateOptionHighlights();

        actionBtn.innerText = "Submit Answer";
        actionBtn.disabled = selectedIndices.length === 0;
        saveQuizProgress();
      }

      function updateOptionHighlights() {
        const buttons = optionsEl.children;
        for (let i = 0; i < buttons.length; i++) {
          buttons[i].classList.toggle("selected", selectedIndices.includes(i));
        }
      }

      function handleAction() {
        const state = userState[currentQuestionIndex];
        if (!isAnswerSubmitted && selectedIndices.length === 0 && state.visitedBefore) {
          nextQuestion();
        } else if (!isAnswerSubmitted) {
          submitAnswer();
        } else {
          nextQuestion();
        }
      }

      function submitAnswer() {
        isAnswerSubmitted = true;
        const state = userState[currentQuestionIndex];
        state.isSubmitted = true;

        const currentData = quizData[currentQuestionIndex];
        const isCorrect =
          selectedIndices.length === currentData.correct.length &&
          selectedIndices.every((val) => currentData.correct.includes(val));

        state.isCorrect = isCorrect;

        if (isCorrect) {
          score++;
        }

        saveQuizProgress();
        restoreSubmittedState();
      }

      function restoreSubmittedState() {
        const currentData = quizData[currentQuestionIndex];
        const buttons = optionsEl.children;

        for (let i = 0; i < buttons.length; i++) {
          buttons[i].disabled = true;
          buttons[i].classList.remove("selected");

          if (currentData.correct.includes(i)) {
            buttons[i].classList.add("correct");
          } else if (selectedIndices.includes(i)) {
            buttons[i].classList.add("incorrect");
          }
        }

        explainBtn.style.display = "inline-block";
        actionBtn.disabled = false;
        actionBtn.innerText =
          currentQuestionIndex < quizData.length - 1 ? "Next Question" : "Show Results";
      }

      function toggleExplanation() {
        const currentData = quizData[currentQuestionIndex];
        let rawText = currentData.explanation || "No explanation provided.";

        rawText = rawText.replace(/\*\s*([A-E])\s*\n\s*:/g, "* **$1:**");
        rawText = rawText.replace(/\*\s*\*\*([A-E])\*\*\s*\n\s*:/g, "* **$1:**");
        rawText = rawText.replace(/\n\s*:\s*/g, ": ");
        rawText = rawText.replace(/\n\s*\.\s*\n/g, "\n");

        explanationText.innerHTML = marked.parse(rawText);
        explanationBox.style.display =
          explanationBox.style.display === "block" ? "none" : "block";
      }

      function prevQuestion() {
        if (currentQuestionIndex > 0) {
          currentQuestionIndex--;
          loadQuestion();
        }
      }

      function nextQuestion() {
        currentQuestionIndex++;
        if (currentQuestionIndex < quizData.length) {
          loadQuestion();
        } else {
          showScore();
        }
      }

      function showScore() {
        quizScreen.style.display = "none";
        scoreScreen.style.display = "block";
        finalScoreEl.innerText = `You scored ${score} out of ${quizData.length} (${Math.round((score / quizData.length) * 100)}%)`;
      }

      function restartQuiz() {
        localStorage.removeItem(getExamStorageKey(currentCert, currentProvider, currentExamFile));
        currentQuestionIndex = 0;
        score = 0;
        userState = quizData.map(() => ({
          selectedIndices: [],
          isSubmitted: false,
          isCorrect: false,
          visitedBefore: false,
        }));
        scoreScreen.style.display = "none";
        quizScreen.style.display = "block";
        loadQuestion();
      }

      function initApp() {
        const lastSession = localStorage.getItem(STORAGE_KEY_LAST_SESSION);

        if (lastSession) {
          const session = JSON.parse(lastSession);
          currentCert = session.cert || "clf-c02";
          currentProvider = session.provider || "kananinirav";
          currentExamFile = session.examFile || "practice-exam-1.json";
        }

        certSelect.value = currentCert;
        switchCertification(currentCert);
      }

      initApp();
    </script>
  </body>
</html>

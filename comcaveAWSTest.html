rukturkosten."}, {"t": "Amazon RDS for PostgreSQL", "ok": false, "why": "Eine dauerhaft laufende Datenbankinstanz kostet auch ohne Abfragen, und die Daten müssten erst aus S3 geladen werden."}, {"t": "Amazon Redshift Spectrum", "ok": false, "why": "Spectrum fragt S3-Daten ebenfalls ab, setzt aber ein Redshift-Data-Warehouse voraus, dessen Kosten auch bei seltener Nutzung anfallen."}, {"t": "Amazon Aurora", "ok": false, "why": "Eine relationale Datenbank ist kein Werkzeug für Analysen auf einem Data Lake in S3 und verursacht laufende Kosten."}]}, {"n": 43, "d": 1, "topic": "SQS", "q": "An online photo application lets users upload photos and perform image editing operations. The application is built on Amazon EC2 instances and offers two classes of service: free and paid. Photos submitted by paid users are processed before those submitted by free users. Photos are uploaded to Amazon S3 and the job information is sent to Amazon SQS.\n\nWhich configuration should a solutions architect recommend?", "code": "", "tail": "", "opts": [{"t": "Use two SQS FIFO queues: one for paid users and one for free users. Set the free queue to use short polling and the paid queue to use long polling.", "ok": false, "why": "Die Art des Pollings beeinflusst Kosten und leere Antworten, nicht die Priorität. Eine Reihenfolge innerhalb einer Klasse ist hier nicht gefordert, FIFO bringt nur Durchsatzgrenzen."}, {"t": "Use one SQS standard queue. Set the visibility timeout of the photos from paid users to zero. Configure the application on the Amazon EC2 instances to prioritize visibility settings so photos from paid users are processed first.", "ok": false, "why": "Der Visibility Timeout regelt, wie lange eine abgeholte Nachricht unsichtbar bleibt, aber keine Priorität. Ein Timeout von 0 würde zu doppelter Verarbeitung führen."}, {"t": "Use two SQS standard queues: one for paid users and one for free users. Configure the application on the Amazon EC2 instances to prioritize polling for the paid queue over the free queue.", "ok": true, "why": "SQS kennt keine Nachrichtenprioritäten. Das übliche Muster sind getrennte Queues pro Priorität; die Worker fragen zuerst die Queue der zahlenden Nutzer ab und nur wenn sie leer ist die der kostenlosen."}, {"t": "Use one SQS FIFO queue. Assign a higher priority to the photos from paid users so they are processed first.", "ok": false, "why": "Weder Standard- noch FIFO-Queues unterstützen Prioritäten für einzelne Nachrichten."}]}, {"n": 44, "d": 3, "topic": "S3", "q": "An application provides a feature that allows users to securely download private and personal files. The web server is currently overwhelmed with serving files for download. A solutions architect must find a more effective solution to reduce the web server load and cost, and must allow users to download only their own files.\n\nWhich solution meets all requirements?", "code": "", "tail": "", "opts": [{"t": "Store the files in an encrypted Amazon Elastic Block Store (Amazon EBS) volume, and use a separate set of servers to serve the downloads.", "ok": false, "why": "Zusätzliche Server verlagern die Last nur und erhöhen die Kosten."}, {"t": "Have the application encrypt the files and store them in the local Amazon EC2 instance store prior to serving them up for download.", "ok": false, "why": "Die Downloads liefen weiterhin über die Webserver, und Instance Store ist flüchtig."}, {"t": "Create an Amazon CloudFront distribution to distribute and cache the files.", "ok": false, "why": "CloudFront entlastet zwar, aber ohne Signed URLs oder Cookies könnte jeder alle Dateien abrufen; private Dateien zu cachen ist hier zudem wenig sinnvoll."}, {"t": "Store the files securely on Amazon S3 and have the application generate an Amazon S3 presigned URL for the user to download.", "ok": true, "why": "Die Dateien liegen privat in S3. Nach der Anmeldung erzeugt die Anwendung für genau die Datei des Nutzers eine zeitlich begrenzte Presigned URL; der Download läuft direkt von S3, nicht über den Webserver. Das entlastet den Server, senkt Kosten und erlaubt nur den Zugriff auf eigene Dateien."}]}, {"n": 45, "d": 2, "topic": "Kinesis", "q": "A media company has an application that tracks user clicks on its websites and performs analytics to provide near-real-time recommendations. The application has a fleet of Amazon EC2 instances that receive data from the websites and send the data to an Amazon RDS DB instance for long-term retention. Another fleet of EC2 instances hosts the portion of the application that is continuously checking changes in the database and running SQL queries to provide recommendations.\n\nManagement has requested a redesign to decouple the infrastructure. The solution must ensure that data analysts are writing SQL to analyze the new data only. No data can be lost during the deployment.\n\nWhat should a solutions architect recommend to meet these requirements and to provide the FASTEST access to the user activity?", "code": "", "tail": "", "opts": [{"t": "Use Amazon Kinesis Data Streams to capture the data from the websites, Amazon Managed Service for Apache Flink to query the data, and Amazon Data Firehose to persist the data on Amazon S3.", "ok": true, "why": "Kinesis Data Streams nimmt die Klicks entkoppelt und verlustfrei auf. Managed Service for Apache Flink wertet die neuen Daten fortlaufend mit SQL aus, also direkt auf dem Datenstrom, die schnellste Variante. Firehose legt die Daten parallel zur langfristigen Aufbewahrung in S3 ab."}, {"t": "Use Amazon Simple Notification Service (Amazon SNS) to receive data from the websites and proxy the messages to AWS Lambda functions that run the queries and persist the data. Change Amazon RDS to Amazon Aurora Serverless to persist the data.", "ok": false, "why": "SNS puffert nicht; scheitert die Zustellung dauerhaft, können Daten verloren gehen. Die Auswertung bliebe datenbankbasiert und damit langsamer als Streamverarbeitung."}, {"t": "Use Amazon Kinesis Data Streams to capture the data from the websites, Amazon Data Firehose to persist the data on Amazon S3, and Amazon Athena to query the data.", "ok": false, "why": "Entkoppelt und verlustfrei, aber Athena fragt erst die gepufferten Daten in S3 ab. Das ist langsamer als die direkte Auswertung des Datenstroms, und Athena würde ohne zusätzliche Partitionierung nicht nur die neuen Daten lesen."}, {"t": "Use Amazon Simple Queue Service (Amazon SQS) to capture the data from the websites, keep the fleet of EC2 instances, and change to a bigger instance type in the Auto Scaling group configuration.", "ok": false, "why": "SQS entkoppelt zwar, aber die Analyse bliebe der bisherige, langsame Datenbankansatz; größere Instanzen ändern daran nichts."}]}, {"n": 46, "d": 3, "topic": "Encryption", "q": "A company currently operates a web application backed by an Amazon RDS MySQL database. It has automated backups that run daily and are not encrypted. A security audit requires future backups to be encrypted and the unencrypted backups to be destroyed. The company will make at least one encrypted backup before destroying the old backups.\n\nWhat should be done to set up encryption for future backups?", "code": "", "tail": "", "opts": [{"t": "Modify the backup section of the database configuration to toggle the Enable encryption check box.", "ok": false, "why": "Die Verschlüsselung einer bestehenden RDS-Instanz lässt sich nicht nachträglich einschalten; es gibt keine solche Einstellung für Backups."}, {"t": "Create a snapshot of the database. Copy it to an encrypted snapshot. Restore the database from the encrypted snapshot.", "ok": true, "why": "Über einen Snapshot und dessen verschlüsselte Kopie entsteht eine neue, verschlüsselte Instanz. Ab dann sind auch alle automatischen Backups und Snapshots verschlüsselt, und die alten unverschlüsselten Backups können gelöscht werden."}, {"t": "Configure an encrypted read replica on RDS for MySQL. Promote the encrypted read replica to primary. Remove the original database instance.", "ok": false, "why": "Eine Read Replica einer unverschlüsselten Instanz kann nicht verschlüsselt erstellt werden."}, {"t": "Turn on default encryption for the Amazon S3 bucket where backups are stored.", "ok": false, "why": "RDS-Backups liegen zwar intern in S3, aber nicht in einem kundeneigenen Bucket, dessen Einstellungen man ändern könnte."}]}, {"n": 47, "d": 4, "topic": "Aurora", "q": "A solutions architect finds that an Amazon Aurora cluster with On-Demand Instance pricing is being underutilized for a blog application. The application is used only for a few minutes several times each day for reads.\n\nWhat should a solutions architect do to optimize utilization MOST cost-effectively?", "code": "", "tail": "", "opts": [{"t": "Convert the original Aurora database to an Aurora global database.", "ok": false, "why": "Eine Global Database repliziert in weitere Regionen; das erhöht die Kosten und löst die geringe Auslastung nicht."}, {"t": "Convert the original Aurora database to Amazon Aurora Serverless.", "ok": true, "why": "Aurora Serverless passt die Kapazität automatisch an die Last an und skaliert in ruhigen Phasen stark herunter (je nach Version und Einstellung bis auf null). Bei wenigen kurzen Nutzungen am Tag zahlt man so nur für die tatsächlich genutzte Kapazität."}, {"t": "Turn on Auto Scaling on the original Aurora database.", "ok": false, "why": "Aurora Auto Scaling fügt bei Last Read Replicas hinzu; die dauerhaft laufende Writer-Instanz kostet aber weiterhin den ganzen Tag."}, {"t": "Refactor the blog application to use Aurora parallel query.", "ok": false, "why": "Parallel Query beschleunigt analytische Abfragen über große Datenmengen, senkt aber nicht die Kosten einer kaum genutzten Datenbank."}]}, {"n": 48, "d": 1, "topic": "SQS", "q": "A restaurant reservation application needs to access a waiting list. When a customer tries to reserve a table, and none are available, the customer application will put the user on the waiting list, and the application will notify the customer when a table becomes free. The waiting list must preserve the order in which customers were added to the waiting list.\n\nWhich service should the solutions architect recommend to store this waiting list?", "code": "", "tail": "", "opts": [{"t": "Amazon Simple Notification Service (Amazon SNS)", "ok": false, "why": "SNS verteilt Nachrichten an Abonnenten, speichert aber keine Warteliste."}, {"t": "A FIFO queue in Amazon Simple Queue Service (Amazon SQS)", "ok": true, "why": "Eine FIFO-Queue speichert Nachrichten dauerhaft und liefert sie in genau der Reihenfolge aus, in der sie eingefügt wurden, ohne Duplikate. Das entspricht einer Warteliste."}, {"t": "A standard queue in Amazon Simple Queue Service (Amazon SQS)", "ok": false, "why": "Standard-Queues garantieren keine Reihenfolge."}, {"t": "AWS Step Functions invoking AWS Lambda functions", "ok": false, "why": "Step Functions orchestriert Abläufe, ist aber kein Speicher für eine geordnete Warteliste."}]}, {"n": 49, "d": 1, "topic": "Route 53", "q": "A company runs a website on Amazon EC2 instances behind an ELB Application Load Balancer. Amazon Route 53 is used for the DNS. The company wants to set up a backup website with a message including a phone number and email address that users can reach if the primary website is down.\n\nHow should the company deploy this solution?", "code": "", "tail": "", "opts": [{"t": "Use Amazon S3 website hosting for the backup website and a Route 53 failover routing policy.", "ok": true, "why": "Die statische Notfallseite liegt günstig und hochverfügbar als S3-Website. Route-53-Failover-Routing prüft die Hauptseite per Health Check und leitet bei einem Ausfall automatisch auf die S3-Seite um."}, {"t": "Deploy the application in another AWS Region and use ELB health checks for failover routing.", "ok": false, "why": "Eine komplette zweite Umgebung ist für eine einfache Hinweisseite übertrieben teuer. ELB-Health-Checks prüfen Ziele innerhalb eines Load Balancers und leiten nicht zwischen Regionen um."}, {"t": "Deploy the application in another AWS Region and use server-side redirection on the primary website.", "ok": false, "why": "Ist die Hauptseite ausgefallen, kann sie auch nicht mehr umleiten."}, {"t": "Use Amazon S3 website hosting for the backup website and a Route 53 latency routing policy.", "ok": false, "why": "Latenzbasiertes Routing verteilt Nutzer auf den schnellsten Endpunkt, also würden auch im Normalbetrieb Nutzer auf der Notfallseite landen."}]}, {"n": 50, "d": 1, "topic": "Auto Scaling", "q": "An environment has an Auto Scaling group across two Availability Zones referred to as AZ-a and AZ-b. AZ-a has four Amazon EC2 instances, and AZ-b has three EC2 instances. The Auto Scaling group uses a default termination policy. None of the instances are protected from a scale-in event.\n\nHow will Auto Scaling proceed if there is a scale-in event?", "code": "", "tail": "", "opts": [{"t": "Auto Scaling terminates the instance with the oldest launch configuration of all instances.", "ok": false, "why": "Die älteste Launch-Konfiguration bzw. das älteste Launch Template wird erst geprüft, nachdem die AZ ausgewählt wurde, und nur innerhalb dieser AZ."}, {"t": "Auto Scaling terminates the instance with the closest next billing hour of all instances.", "ok": false, "why": "Die Nähe zur nächsten Abrechnungsstunde ist ein späteres Kriterium innerhalb der ausgewählten AZ (und durch sekundengenaue Abrechnung heute kaum relevant)."}, {"t": "Auto Scaling selects an instance to terminate randomly.", "ok": false, "why": "Zufällig wird erst ganz am Ende gewählt, wenn alle anderen Kriterien gleich sind."}, {"t": "Auto Scaling selects the Availability Zone with four EC2 instances, and then continues to evaluate.", "ok": true, "why": "Die Standard-Beendigungsrichtlinie sorgt zuerst für eine ausgewogene Verteilung: Sie wählt die AZ mit den meisten Instanzen (AZ-a mit vier) und wendet dann innerhalb dieser AZ die weiteren Kriterien an, etwa die älteste Launch-Konfiguration."}]}, {"n": 51, "d": 3, "topic": "IAM", "q": "A company has an application running as a service in Amazon Elastic Container Service (Amazon ECS) using the Amazon EC2 launch type. The application code makes AWS API calls to publish messages to Amazon Simple Queue Service (Amazon SQS).\n\nWhat is the MOST secure method of giving the application permission to publish messages to Amazon SQS?", "code": "", "tail": "", "opts": [{"t": "Create a new IAM role with SQS permissions. Then update the task definition to use this role for the task role setting.", "ok": true, "why": "Die Task Role gibt genau diesem ECS-Task temporäre Zugangsdaten mit den nötigen SQS-Rechten. Andere Tasks auf derselben Instanz erhalten sie nicht (Least Privilege), und es gibt keine gespeicherten Schlüssel."}, {"t": "Update the security group used by the ECS cluster to allow access to Amazon SQS.", "ok": false, "why": "Security Groups steuern Netzwerkverkehr, keine API-Berechtigungen; SQS-Aufrufe brauchen IAM-Rechte."}, {"t": "Create a new IAM user with SQS permissions. Then update the task definition to declare the access key ID and secret access key as environment variables.", "ok": false, "why": "Langlebige Schlüssel in Umgebungsvariablen sind ein Sicherheitsrisiko (im Klartext sichtbar, manuell zu rotieren)."}, {"t": "Use AWS Identity and Access Management (IAM) to grant SQS permissions to the role used by the launch configuration for the Auto Scaling group of the ECS cluster.", "ok": false, "why": "Die Rolle der EC2-Instanz gilt für alle Container auf dieser Instanz; jeder Task bekäme SQS-Rechte, das ist zu weit gefasst."}]}, {"n": 52, "d": 1, "topic": "CloudFormation", "q": "A company wants to build an immutable infrastructure for its software applications. The company wants to test the software applications before sending traffic to them. The company seeks an efficient solution that limits the effects of application bugs.\n\nWhich combination of steps should a solutions architect recommend? (Select TWO)", "code": "", "tail": "", "opts": [{"t": "Apply Amazon Route 53 weighted routing to test the staging environment and gradually increase the traffic as the tests pass.", "ok": true, "why": "Mit gewichtetem Routing erhält die neue Umgebung zuerst nur einen kleinen Teil des Verkehrs, der schrittweise erhöht wird, solange alles funktioniert. Fehler betreffen so nur wenige Nutzer (Canary-Prinzip)."}, {"t": "Use AWS CloudFormation with a parameter set to the staging value in a separate environment other than the production environment.", "ok": true, "why": "Dasselbe Template mit einem Parameter für die Staging-Umgebung erzeugt eine identische, separate Umgebung. Die neue Version wird dort getestet, ohne die Produktion zu verändern, ganz im Sinne immutabler Infrastruktur."}, {"t": "Use AWS CloudFormation to update the production infrastructure and roll back the stack if the update fails.", "ok": false, "why": "Die Produktion wird direkt verändert, das widerspricht immutabler Infrastruktur und testet nicht vor dem Einspielen. Ein Rollback greift nur bei Fehlern während des Updates, nicht bei Anwendungsfehlern."}, {"t": "Use AWS CloudFormation to deploy the staging environment with a snapshot deletion policy and reuse the resources in the production environment if the tests pass.", "ok": false, "why": "Die Snapshot-DeletionPolicy sichert Daten beim Löschen; Ressourcen der Testumgebung in der Produktion weiterzuverwenden, ist kein sauberes Bereitstellungsmuster."}, {"t": "Apply Amazon Route 53 failover routing to test the staging environment and fail over to the production environment if the tests pass.", "ok": false, "why": "Failover-Routing schaltet bei Ausfällen um, nicht schrittweise nach erfolgreichen Tests."}]}, {"n": 53, "d": 3, "topic": "Cognito", "q": "A company designs a mobile app for its customers to upload photos to a website. The app needs a secure login with multi-factor authentication (MFA). The company wants to limit the initial build time and the maintenance of the solution.\n\nWhich solution should a solutions architect recommend to meet these requirements?", "code": "", "tail": "", "opts": [{"t": "Use Amazon API Gateway and require server-side encryption (SSE) for photos.", "ok": false, "why": "Verschlüsselung schützt die gespeicherten Fotos, bietet aber keine Anmeldung mit MFA."}, {"t": "Use Amazon Cognito Identity with SMS-based MFA.", "ok": true, "why": "Cognito User Pools bieten fertige Registrierung und Anmeldung für App-Nutzer einschließlich MFA per SMS oder Authenticator-App. Das spart eigene Entwicklung und Wartung."}, {"t": "Edit IAM policies to require MFA for all users.", "ok": false, "why": "IAM ist für Personen und Dienste gedacht, die AWS verwalten, nicht für Endkunden einer App."}, {"t": "Federate IAM against the corporate Active Directory that requires MFA.", "ok": false, "why": "Das Firmenverzeichnis enthält Mitarbeiter, nicht die Kunden der App."}]}, {"n": 54, "d": 1, "topic": "Aurora", "q": "A company needs to implement a relational database with a multi-Region disaster recovery Recovery Point Objective (RPO) of 1 second and a Recovery Time Objective (RTO) of 1 minute.\n\nWhich AWS solution can achieve this?", "code": "", "tail": "", "opts": [{"t": "Amazon Aurora Global Database", "ok": true, "why": "Aurora Global Database repliziert über das AWS-Backbone in andere Regionen, typischerweise mit weniger als einer Sekunde Verzögerung (RPO etwa 1 Sekunde). Eine sekundäre Region lässt sich in etwa einer Minute zur Primärregion machen (RTO etwa 1 Minute)."}, {"t": "Amazon RDS for MySQL with Multi-AZ turned on", "ok": false, "why": "Multi-AZ schützt nur innerhalb einer Region, nicht gegen den Ausfall einer Region."}, {"t": "Amazon DynamoDB global tables", "ok": false, "why": "Global Tables erfüllen ähnliche Werte, aber DynamoDB ist keine relationale Datenbank."}, {"t": "Amazon RDS for MySQL with a cross-Region snapshot copy", "ok": false, "why": "Snapshot-Kopien entstehen periodisch; das RPO liegt bei Minuten bis Stunden, und das Wiederherstellen dauert deutlich länger als eine Minute."}]}, {"n": 55, "d": 3, "topic": "IAM", "q": "A company has implemented one of its microservices on AWS Lambda that accesses an Amazon DynamoDB table named \"Books\". A solutions architect is designing an IAM policy to be attached to the Lambda function's IAM role giving it access to put, update, and delete items in the \"Books\" table. The IAM policy must prevent the function from performing any other actions on the \"Books\" table and any other table.\n\nWhich IAM policy would fulfill these needs and provide the LEAST privileged access?", "code": "", "tail": "", "opts": [{"t": "{\n  \"Version\": \"2012-10-17\",\n  \"Statement\": [\n    {\n      \"Sid\": \"PutUpdateDeleteOnBooks\",\n      \"Effect\": \"Allow\",\n      \"Action\": [\n        \"dynamodb:PutItem\",\n        \"dynamodb:UpdateItem\",\n        \"dynamodb:DeleteItem\"\n      ],\n      \"Resource\": \"arn:aws:dynamodb:us-west-2:123456789012:table/Books\"\n    }\n  ]\n}", "ok": true, "why": "Erlaubt genau die drei benötigten Aktionen (PutItem, UpdateItem, DeleteItem) auf genau der Tabelle „Books“. Alles andere ist implizit verweigert, denn IAM erlaubt nur, was ausdrücklich gestattet ist. Das ist Least Privilege."}, {"t": "{\n  \"Version\": \"2012-10-17\",\n  \"Statement\": [\n    {\n      \"Sid\": \"PutUpdateDeleteOnBooks\",\n      \"Effect\": \"Allow\",\n      \"Action\": \"dynamodb:*\",\n      \"Resource\": \"arn:aws:dynamodb:us-west-2:123456789012:table/Books\"\n    }\n  ]\n}", "ok": false, "why": "dynamodb:* erlaubt sämtliche Aktionen auf „Books“, auch Lesen, Scannen oder das Löschen der Tabelle; das verstößt gegen die Anforderung."}, {"t": "{\n  \"Version\": \"2012-10-17\",\n  \"Statement\": [\n    {\n      \"Sid\": \"PutUpdateDeleteOnBooks\",\n      \"Effect\": \"Allow\",\n      \"Action\": \"dynamodb:*\",\n      \"Resource\": \"arn:aws:dynamodb:us-west-2:123456789012:table/Books\"\n    },\n    {\n      \"Sid\": \"PutUpdateDeleteOnBooks\",\n      \"Effect\": \"Deny\",\n      \"Action\": \"dynamodb:*:*\",\n      \"Resource\": \"arn:aws:dynamodb:us-west-2:123456789012:table/Books\"\n  ]\n}", "ok": false, "why": "Die Policy ist ungültig: Die Aktion dynamodb:*:* gibt es nicht, beide Statements haben dieselbe Sid, und es fehlt eine schließende Klammer. Selbst sinngemäß würde ein Deny auf alle Aktionen auch Put, Update und Delete blockieren, denn ein explizites Deny gewinnt immer."}, {"t": "{\n  \"Version\": \"2012-10-17\",\n  \"Statement\": [\n    {\n      \"Sid\": \"PutUpdateDeleteOnBooks\",\n      \"Effect\": \"Allow\",\n      \"Action\": [\n        \"dynamodb:PutItem\",\n        \"dynamodb:UpdateItem\",\n        \"dynamodb:DeleteItem\"\n      ],\n      \"Resource\": \"arn:aws:dynamodb:us-west-2:123456789012:table/*\"\n    }\n  ]\n}", "ok": false, "why": "Die Aktionen stimmen, aber table/* gilt für alle Tabellen im Konto und in der Region. Die Funktion dürfte damit auch in anderen Tabellen schreiben und löschen."}]}, {"n": 56, "d": 1, "topic": "SQS", "q": "A web application runs on Amazon EC2 instances behind an Application Load Balancer (ALB). The application allows users to create custom reports of historical weather data. Generating a report can take up to 5 minutes. These long-running requests use many of the available incoming connections, making the system unresponsive to other users.\n\nHow can a solutions architect make the system more responsive?", "code": "", "tail": "", "opts": [{"t": "Use Amazon SQS with AWS Lambda to generate reports.", "ok": true, "why": "Die Anwendung legt den Berichtsauftrag in eine SQS-Queue und antwortet sofort; Lambda erzeugt die Berichte asynchron (bis zu 15 Minuten Laufzeit sind möglich). Die Webserver-Verbindungen werden nicht mehr minutenlang blockiert."}, {"t": "Update the client-side application code to increase its request timeout to 5 minutes.", "ok": false, "why": "Verhindert nur Abbrüche beim Client; die Verbindungen bleiben weiterhin blockiert."}, {"t": "Publish the reports to Amazon S3 and use Amazon CloudFront for downloading to the user.", "ok": false, "why": "Beschleunigt die Auslieferung fertiger Berichte, aber nicht die minutenlange Erzeugung, die die Verbindungen belegt."}, {"t": "Increase the idle timeout on the ALB to 5 minutes.", "ok": false, "why": "Lässt lange Anfragen zwar zu Ende laufen, hält die Verbindungen aber noch länger offen und verschlimmert das Problem."}]}, {"n": 57, "d": 3, "topic": "Secrets", "q": "An application running on AWS Lambda requires an API key to access a third-party service. The key must be stored securely with audited access to the Lambda function only.\n\nWhat is the MOST secure way to store the key?", "code": "", "tail": "", "opts": [{"t": "Inside a file on an Amazon EBS volume attached to the Lambda function", "ok": false, "why": "EBS-Volumes lassen sich nicht an Lambda-Funktionen anhängen."}, {"t": "As a secure string in AWS Systems Manager Parameter Store", "ok": true, "why": "Ein SecureString in Parameter Store ist mit KMS verschlüsselt. Per IAM-Policy darf nur die Execution Role der Lambda-Funktion ihn lesen, und jeder Zugriff wird in CloudTrail protokolliert. (AWS Secrets Manager wäre ebenfalls geeignet, besonders mit automatischer Rotation.)"}, {"t": "As an object in Amazon S3", "ok": false, "why": "S3 ist kein Speicher für Geheimnisse; die Zugriffskontrolle wäre gröber, und S3-Datenzugriffe werden nur mit zusätzlich aktivierten Data Events protokolliert."}, {"t": "Inside a secrets file stored on Amazon EFS", "ok": false, "why": "Eine Datei auf EFS bietet keine feingranulare Prüfung, wer den Schlüssel gelesen hat, und erfordert zusätzlich VPC-Anbindung und Mount-Konfiguration."}]}, {"n": 58, "d": 2, "topic": "DynamoDB", "q": "A company is using Amazon DynamoDB with provisioned throughput for the inventory database tier of its ecommerce website. During flash sales, customers experience periods of time when the database cannot handle the high number of transactions taking place. This causes the company to lose transactions. During normal periods, the database performs appropriately.\n\nWhich solution solves the performance problem the company faces?", "code": "", "tail": "", "opts": [{"t": "Switch DynamoDB to on-demand mode during flash sales.", "ok": true, "why": "Im On-Demand-Modus passt DynamoDB die Kapazität sofort an die tatsächliche Anfragerate an; plötzliche Spitzen werden ohne vorher bereitgestellte Kapazität verarbeitet, und keine Transaktionen gehen durch Drosselung verloren. Der Wechsel zwischen den Modi ist ohne Ausfallzeit möglich."}, {"t": "Use Amazon Simple Queue Service (Amazon SQS) to queue transactions to DynamoDB.", "ok": false, "why": "Eine Queue puffert die Spitzen, die Bestellungen würden aber verzögert verbucht; das Kapazitätsproblem der Datenbank bleibt."}, {"t": "Use Amazon Kinesis to queue transactions for processing to DynamoDB.", "ok": false, "why": "Wie bei SQS: nur Pufferung und Verzögerung, keine zusätzliche Datenbankkapazität."}, {"t": "Implement DynamoDB Accelerator (DAX).", "ok": false, "why": "DAX beschleunigt Lesezugriffe; das Problem sind aber die vielen schreibenden Transaktionen."}]}, {"n": 59, "d": 3, "topic": "CloudFront", "q": "A company is designing a website that will be hosted on Amazon S3.\n\nHow should users be prevented from linking directly to the assets in the S3 bucket?", "code": "", "tail": "", "opts": [{"t": "Create a static website, then configure an Amazon Route 53 record set with an alias pointing to the static website. Provide this URL to users.", "ok": false, "why": "Ein schönerer Domainname ändert nichts daran, dass die Dateien im Bucket weiterhin direkt erreichbar sind."}, {"t": "Create an Amazon CloudFront distribution with an origin access control (OAC) and update the bucket policy to grant permission to the OAC only.", "ok": true, "why": "Mit Origin Access Control signiert CloudFront die Anfragen an den Bucket, und die Bucket Policy erlaubt nur diese Distribution. Direkte Links auf S3-URLs funktionieren nicht mehr; Nutzer erreichen die Inhalte nur über CloudFront."}, {"t": "Create a static website, then update the bucket policy to require users to access the resources with the static website URL.", "ok": false, "why": "Eine Bucket Policy kann nicht erzwingen, über welche URL zugegriffen wird. Für S3-Website-Hosting müssen die Objekte zudem öffentlich lesbar sein."}, {"t": "Create an Amazon CloudFront distribution with an AWS WAF web ACL that permits access to the origin server through the distribution only.", "ok": false, "why": "WAF filtert Anfragen an CloudFront, schützt aber nicht den Bucket vor direktem Zugriff an CloudFront vorbei."}]}, {"n": 60, "d": 2, "topic": "DynamoDB", "q": "A company is using Amazon DynamoDB to stage its product catalog, which is 1 TB in size. A product entry consists of an average of 100 KB of data, and the average traffic is about 250 requests each second. A database administrator has provisioned 3,000 read capacity units (RCUs) of throughput.\n\nHowever, some products are popular among users. Users are experiencing delays or timeouts because of throttling. The popularity is expected to continue to increase, but the number of products will stay constant.\n\nWhat should a solutions architect do as a long-term solution to this problem?", "code": "", "tail": "", "opts": [{"t": "Use DynamoDB Accelerator (DAX) to maintain the frequently read items.", "ok": true, "why": "Einige beliebte Produkte werden sehr häufig gelesen (heiße Schlüssel). DAX hält diese Items im Arbeitsspeicher und beantwortet die wiederholten Lesezugriffe, ohne DynamoDB-Kapazität zu verbrauchen. Das löst die Drosselung dauerhaft, auch wenn die Beliebtheit weiter steigt."}, {"t": "Change the partition key to consist of a hash of the product key and product type instead of just the product key.", "ok": false, "why": "Ein beliebtes Produkt bleibt auch mit neuem Schlüssel ein einzelnes Item, auf das sich alle Lesezugriffe konzentrieren; die Last verteilt sich dadurch nicht."}, {"t": "Increase the provisioned throughput to 6,000 RCUs.", "ok": false, "why": "Mehr Kapazität hilft nur kurzfristig und kostet dauerhaft mehr. Die Last eines heißen Items bleibt auf eine Partition begrenzt, und die Beliebtheit steigt weiter."}, {"t": "Augment DynamoDB by storing only the key product attributes, with the details stored in Amazon S3.", "ok": false, "why": "Kleinere Items senken den RCU-Bedarf etwas, erfordern aber einen Umbau und zusätzliche S3-Abrufe; die heißen Schlüssel bleiben das Problem."}]}, {"n": 61, "d": 2, "topic": "Global Accelerator", "q": "A company has a well-architected application that streams audio data by using UDP in the AWS Cloud. The company hosts the application in the eu-central-1 Region. The company plans to offer services to North American users. A solutions architect must improve application network performance for the North American users.\n\nWhich of the following is the MOST cost-effective solution?", "code": "", "tail": "", "opts": [{"t": "Create an AWS Global Accelerator standard accelerator with an endpoint group in eu-central-1.", "ok": true, "why": "Global Accelerator unterstützt UDP und führt den Verkehr der nordamerikanischen Nutzer am nächsten Edge-Standort ins AWS-Backbone, statt über das öffentliche Internet bis nach Frankfurt. Die Anwendung muss dafür nicht in weitere Regionen kopiert werden."}, {"t": "Create an Amazon CloudFront distribution and use the North America (United States, Mexico, Canada) and Europe and Israel price classes.", "ok": false, "why": "CloudFront arbeitet mit HTTP(S) und WebSocket, nicht mit beliebigem UDP-Verkehr."}, {"t": "Configure the application to use an Amazon Route 53 latency-based routing policy.", "ok": false, "why": "Latenzbasiertes Routing hilft nur, wenn es Endpunkte in mehreren Regionen gibt; mit einer Region verbessert es nichts."}, {"t": "Use AWS CloudFormation to deploy additional application infrastructure in the us-east-1 Region and the us-west-1 Region.", "ok": false, "why": "Zwei zusätzliche Regionen würden helfen, verdreifachen aber in etwa die Infrastrukturkosten; nicht die kosteneffizienteste Lösung."}]}, {"n": 62, "d": 3, "topic": "Encryption", "q": "A company is planning to use Amazon S3 to store images uploaded by its users. The images must be encrypted at rest in Amazon S3. The company does not want to spend time managing and rotating the keys, but it does want to control who can access those keys.\n\nWhat should a solutions architect use to accomplish this?", "code": "", "tail": "", "opts": [{"t": "Server-Side Encryption with encryption keys stored in an S3 bucket", "ok": false, "why": "Schlüssel in einem Bucket abzulegen, ist keine verwaltete Schlüsselverwaltung; Rotation und Zugriffskontrolle müsste man selbst bauen."}, {"t": "Server-Side Encryption with encryption keys stored in AWS Systems Manager Parameter Store", "ok": false, "why": "Parameter Store ist kein Schlüsselverwaltungsdienst für S3-Verschlüsselung; S3 kann solche Schlüssel nicht direkt nutzen."}, {"t": "Server-Side Encryption with Customer-Provided Keys (SSE-C)", "ok": false, "why": "Bei SSE-C liefert und verwaltet der Kunde die Schlüssel selbst, inklusive Rotation; genau das soll vermieden werden."}, {"t": "Server-Side Encryption with AWS KMS-Managed Keys (SSE-KMS)", "ok": true, "why": "Bei SSE-KMS verwaltet AWS KMS die Schlüssel und kann sie automatisch rotieren. Über Key Policies und IAM legt die Firma fest, wer die Schlüssel verwenden darf, und jede Nutzung wird in CloudTrail protokolliert."}]}, {"n": 63, "d": 2, "topic": "CloudFront", "q": "A company runs an online media site, hosted on-premises. An employee posted a product review that contained videos and pictures. The review went viral, and the company needs to handle the resulting spike in website traffic.\n\nWhat action would provide an immediate solution?", "code": "", "tail": "", "opts": [{"t": "Add server instances using Amazon EC2 and use Amazon Route 53 with a failover routing policy.", "ok": false, "why": "Failover-Routing schaltet nur bei Ausfall um und verteilt keine Last. Die Anwendung müsste erst auf EC2 eingerichtet werden; keine sofortige Lösung."}, {"t": "Redesign the website to use Amazon API Gateway, and use AWS Lambda to deliver content.", "ok": false, "why": "Ein Umbau der Website dauert viel zu lange, um eine akute Lastspitze abzufangen."}, {"t": "Use Amazon ElastiCache (Redis OSS) for caching and reducing the load requests from the origin.", "ok": false, "why": "ElastiCache liegt in AWS und müsste in die On-Premises-Anwendung integriert werden; große Videos und Bilder cacht man dort nicht."}, {"t": "Serve the images and videos using an Amazon CloudFront distribution created using the media site as the origin.", "ok": true, "why": "CloudFront kann einen beliebigen HTTP-Server, auch im eigenen Rechenzentrum, als Origin nutzen. Die Bilder und Videos werden an den Edge-Standorten zwischengespeichert, sodass der Großteil der Anfragen den eigenen Server gar nicht mehr erreicht. Das ist schnell eingerichtet und ohne Umbau wirksam."}]}, {"n": 64, "d": 4, "topic": "Aurora", "q": "A company wants to deploy an additional Amazon Aurora MySQL DB cluster for development purposes. This cluster will be used several times a week for a few minutes upon request to debug production query issues. The company wants to keep overhead low for this resource.\n\nWhich solution meets the company's requirements MOST cost-effectively?", "code": "", "tail": "", "opts": [{"t": "Create a stop/start schedule for the DB instances.", "ok": false, "why": "Die Nutzung erfolgt unregelmäßig nach Bedarf; ein fester Zeitplan passt nicht. Gestoppte Aurora-Cluster starten zudem nach 7 Tagen automatisch wieder."}, {"t": "Create an AWS Lambda function to stop DB instances if there are no active connections.", "ok": false, "why": "Eigener Code bedeutet zusätzlichen Aufwand, und bei Bedarf müsste die Datenbank erst wieder gestartet werden (Minuten Wartezeit)."}, {"t": "Purchase a Reserved Instance for the DB instances.", "ok": false, "why": "Eine Reservierung lohnt sich nur bei Dauerbetrieb; für wenige Minuten pro Woche zahlt man fast ausschließlich für ungenutzte Zeit."}, {"t": "Run the DB instances on Aurora Serverless.", "ok": true, "why": "Aurora Serverless skaliert die Kapazität automatisch mit der Nutzung und in Leerlaufzeiten stark herunter (je nach Konfiguration bis auf null). Bei sporadischer Nutzung zahlt man fast nur für die tatsächlich genutzte Zeit, ohne eigenen Verwaltungsaufwand."}]}, {"n": 65, "d": 2, "topic": "DynamoDB", "q": "A database architect is designing an online gaming application that uses a simple, unstructured data format. The database must have the ability to store user information and to track the progress of each user. The database must have the ability to scale to millions of users throughout the week.\n\nWhich database service will meet these requirements with the LEAST amount of operational support?", "code": "", "tail": "", "opts": [{"t": "Amazon DynamoDB", "ok": true, "why": "DynamoDB ist eine vollständig verwaltete, serverlose NoSQL-Datenbank für einfache, schemafreie Daten wie Nutzerprofile und Spielstände. Sie skaliert automatisch auf Millionen Nutzer, ohne Server, Patches oder Kapazitätsplanung."}, {"t": "Amazon Aurora", "ok": false, "why": "Relationale Datenbank mit festem Schema; für einfache, unstrukturierte Daten nicht nötig, und Skalierung sowie Instanzgrößen müssen geplant werden."}, {"t": "Amazon Neptune", "ok": false, "why": "Graphdatenbank für stark vernetzte Beziehungen; hier gibt es keine solchen Anforderungen."}, {"t": "Amazon RDS Multi-AZ", "ok": false, "why": "Relational, mit festen Instanzgrößen und mehr Betriebsaufwand; die Skalierung auf Millionen Nutzer ist deutlich aufwendiger."}]}];
  const TOTAL = QUESTIONS.length;
  const LIMIT = 120;            // Sekunden pro Frage
  const LETTERS = 'ABCDEFG';
  const DOMAIN = { 1: 'Resilient', 2: 'High-Performing', 3: 'Secure', 4: 'Cost-Optimized' };
  const app = document.getElementById('app');

  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const fmt = sec => Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0');
  function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
  const correctIdx = q => q.opts.map((o, i) => o.ok ? i : -1).filter(i => i >= 0);
  const needed = q => correctIdx(q).length;

  // Zustand
  // Jede Frage kann einzeln über „Antwort prüfen“ aufgelöst werden; alles andere zeigt die Auswertung am Ende.
  let finished = false, confirmFinish = false;
  let current = 0, paused = false;
  const order = {}, selected = {}, checked = {}, timedOut = {}, remaining = {}, timeUsed = {};

  // Antwortreihenfolge bei jedem Laden neu mischen
  QUESTIONS.forEach((q, k) => { order[k] = shuffle(q.opts.map((_, i) => i)); selected[k] = []; remaining[k] = LIMIT; });

  const isCorrect = k => { const c = correctIdx(QUESTIONS[k]); const s = selected[k]; return s.length === c.length && c.every(i => s.includes(i)); };
  const locked = k => checked[k] || timedOut[k];
  const letterOf = (k, i) => LETTERS[order[k].indexOf(i)];

  /* ---------- Frage ---------- */
  function optionHtml(k, i, pos, reveal) {
    const q = QUESTIONS[k], o = q.opts[i];
    const sel = selected[k].includes(i);
    let cls = 'option' + (needed(q) > 1 ? ' multi' : '');
    let tag = '';
    if (reveal) {
      if (o.ok) { cls += ' correct'; tag = sel ? 'deine Wahl · richtig' : 'richtig'; }
      else if (sel) { cls += ' incorrect'; tag = 'deine Wahl'; }
    } else if (sel) cls += ' selected';
    const text = o.t.trim().startsWith('{') ? `<pre class="code">${esc(o.t)}</pre>` : esc(o.t);
    return `<button type="button" class="${cls}" data-opt="${i}" ${locked(k) || finished ? 'disabled' : ''}>
      ${reveal ? '' : '<span class="mark"></span>'}<span class="opt-letter">${LETTERS[pos]}</span><span class="opt-text">${text}</span>${tag ? `<span class="opt-tag">${tag}</span>` : ''}</button>`;
  }
  function explanationsHtml(k) {
    const q = QUESTIONS[k];
    return `<div class="sol-title">Richtige Antwort: ${correctIdx(q).map(i => letterOf(k, i)).sort().join(' + ')}</div>` +
      order[k].map((i, pos) => { const o = q.opts[i]; return `
      <div class="sol-item ${o.ok ? 'correct' : 'incorrect'}">
        <div class="sol-head"><span class="opt-letter">${LETTERS[pos]}</span><span class="sol-verdict">${o.ok ? '✔ Richtig' : '✘ Falsch'}</span></div>
        <p>${esc(o.why)}</p>
      </div>`; }).join('');
  }
  function questionBodyHtml(k, reveal) {
    const q = QUESTIONS[k];
    return `
      <div class="q-meta">
        <span class="q-num">Frage ${q.n}</span>
        <span class="badge domain-${q.d}">Domain ${q.d} · ${DOMAIN[q.d]}</span>
        ${needed(q) > 1 ? `<span class="badge multi-badge">Wähle ${needed(q)}</span>` : ''}
        <span class="topic">${esc(q.topic)}</span>
      </div>
      ${q.q.split('\n\n').map(p => `<p class="q-text">${esc(p)}</p>`).join('')}
      ${q.code ? `<pre class="code">${esc(q.code)}</pre>` : ''}
      ${q.tail ? q.tail.split('\n\n').map(p => `<p class="q-text">${esc(p)}</p>`).join('') : ''}
      <div class="options">${order[k].map((i, pos) => optionHtml(k, i, pos, reveal)).join('')}</div>`;
  }
  function navClass(k) {
    let c = '';
    if (checked[k]) c = isCorrect(k) ? 'right' : 'wrong';
    else if (selected[k].length || timedOut[k]) c = 'answered';
    return c + (k === current ? ' active' : '');
  }
  function renderQuestion() {
    const q = QUESTIONS[current];
    const reveal = !!checked[current];
    const answeredCount = QUESTIONS.filter((_, k) => selected[k].length).length;
    let actions = '';
    if (!checked[current]) {
      if (timedOut[current]) {
        actions = `<button class="btn btn-secondary" id="check">Lösung anzeigen</button>
          <span class="locked-note">Zeit abgelaufen – die Antwort ist gesperrt. Du kannst die Lösung jetzt ansehen oder erst in der Auswertung.</span>`;
      } else {
        actions = `<button class="btn btn-primary" id="check" ${selected[current].length === needed(q) ? '' : 'disabled'}>Antwort prüfen</button>
          <span class="locked-note">${needed(q) > 1 ? `Wähle ${needed(q)} Antworten. ` : ''}Optional – sonst siehst du die Lösung in der Auswertung.</span>`;
      }
    }
    const feedback = reveal ? `<div class="feedback ${isCorrect(current) ? 'feedback-correct' : 'feedback-incorrect'}">${isCorrect(current) ? '✔ Richtig!' : (selected[current].length ? '✘ Leider falsch.' : '✘ Zeit abgelaufen, keine Antwort gegeben.')}</div>` : '';
    const unanswered = TOTAL - answeredCount;
    app.innerHTML = `
      <div class="topline">
        <span>${answeredCount} von ${TOTAL} beantwortet · ${QUESTIONS.filter((_, k) => checked[k]).length} geprüft</span>
        <button class="btn btn-ghost btn-small" id="finish">Auswertung</button>
      </div>
      ${confirmFinish ? `<div class="finish-confirm"><span>${unanswered ? `Noch ${unanswered} Frage(n) unbeantwortet. Trotzdem auswerten?` : 'Alle Fragen beantwortet. Jetzt auswerten?'}</span>
        <button class="btn btn-primary btn-small" id="finish-yes">Auswerten</button><button class="btn btn-ghost btn-small" id="finish-no">Abbrechen</button></div>` : ''}
      <nav class="jump" aria-label="Zu Frage springen">${QUESTIONS.map((x, k) => `<button type="button" data-goto="${k}" class="${navClass(k)}">${x.n}</button>`).join('')}</nav>
      <div class="pager">
        <button class="btn btn-ghost" id="prev" ${current === 0 ? 'disabled' : ''}>&larr; Zurück</button>
        <span class="pager-mid">
          <span class="pos">Frage ${current + 1} von ${TOTAL}</span>
          <span class="timer" id="timer"></span>
          <button class="btn btn-ghost btn-small" id="pause">Pause</button>
        </span>
        ${current === TOTAL - 1 ? `<button class="btn btn-primary" id="last">Zur Auswertung</button>` : `<button class="btn btn-primary" id="next">Weiter &rarr;</button>`}
      </div>
      <section class="card">
        ${questionBodyHtml(current, reveal)}
        ${feedback}
        <div class="actions">${actions}</div>
        ${reveal ? `<div style="margin-top:14px;">${explanationsHtml(current)}</div>` : ''}
      </section>
      <p class="hint">Pfeiltasten ← / → wechseln die Frage. Pro Frage 2 Minuten.</p>`;
    renderTimer();
    bindQuestion();
  }
  function bindQuestion() {
    app.querySelectorAll('.option').forEach(b => b.addEventListener('click', () => choose(Number(b.dataset.opt))));
    app.querySelectorAll('.jump button').forEach(b => b.addEventListener('click', () => go(Number(b.dataset.goto))));
    const on = (id, fn) => { const el = document.getElementById(id); if (el) el.addEventListener('click', fn); };
    on('prev', () => go(current - 1));
    on('next', () => go(current + 1));
    on('last', () => { confirmFinish = true; renderQuestion(); });
    on('finish', () => { confirmFinish = true; renderQuestion(); });
    on('finish-yes', finish);
    on('finish-no', () => { confirmFinish = false; renderQuestion(); });
    on('check', () => check(current));
    on('pause', () => { paused = !paused; renderTimer(); });
  }
  function choose(i) {
    const k = current, q = QUESTIONS[k];
    if (locked(k) || finished) return;
    const s = selected[k];
    if (needed(q) === 1) selected[k] = [i];
    else if (s.includes(i)) selected[k] = s.filter(x => x !== i);
    else if (s.length < needed(q)) selected[k] = [...s, i];
    else selected[k] = [...s.slice(1), i];   // bei voller Auswahl ersetzt die neue die älteste
    renderQuestion();
  }
  function check(k) {
    checked[k] = true;
    if (!timedOut[k]) timeUsed[k] = LIMIT - remaining[k];
    renderQuestion();
  }
  function go(k) {
    if (k < 0 || k >= TOTAL) return;
    current = k; paused = false; confirmFinish = false;
    renderQuestion();
    window.scrollTo(0, 0);
  }

  /* ---------- Timer ---------- */
  function renderTimer() {
    const el = document.getElementById('timer'), pb = document.getElementById('pause');
    if (!el) return;
    const k = current, left = remaining[k];
    el.className = 'timer';
    if (timedOut[k]) { el.textContent = 'Zeit abgelaufen'; el.classList.add('over'); }
    else if (checked[k]) { el.textContent = '✔ ' + fmt(timeUsed[k] ?? (LIMIT - left)); el.classList.add('done'); }
    else { el.textContent = fmt(left); if (left <= 30) el.classList.add('warn'); }
    if (paused) el.classList.add('paused');
    pb.textContent = paused ? 'Weiter' : 'Pause';
    pb.disabled = locked(k);
  }
  setInterval(() => {
    if (finished || paused) return;
    const k = current;
    if (locked(k)) return;
    remaining[k] = Math.max(0, remaining[k] - 1);
    if (remaining[k] === 0) {
      timedOut[k] = true;
      timeUsed[k] = LIMIT;
      renderQuestion();
    } else renderTimer();
  }, 1000);

  /* ---------- Auswertung ---------- */
  function finish() {
    finished = true; confirmFinish = false;
    const right = QUESTIONS.filter((_, k) => isCorrect(k)).length;
    const pct = Math.round(right / TOTAL * 100);
    const byDomain = {};
    QUESTIONS.forEach((q, k) => { const d = byDomain[q.d] = byDomain[q.d] || { r: 0, t: 0 }; d.t++; if (isCorrect(k)) d.r++; });
    const totalTime = QUESTIONS.reduce((s, _, k) => s + (timeUsed[k] ?? (LIMIT - remaining[k])), 0);
    app.innerHTML = `
      <section class="hero"><h1>Auswertung</h1></section>
      <section class="card" style="text-align:center;">
        <div class="score">${right} / ${TOTAL} (${pct} %)</div>
        <div class="score-sub">${pct >= 72 ? 'Bestanden (Richtwert 72 %)' : 'Unter dem Richtwert von 72 %'} · Bearbeitungszeit ${fmt(totalTime)}</div>
        <div class="score-sub" style="margin-top:6px;">${Object.keys(byDomain).sort().map(d => `Domain ${d} · ${DOMAIN[d]}: ${byDomain[d].r}/${byDomain[d].t}`).join(' · ')}</div>
        <div style="margin-top:14px;"><button class="btn btn-primary" id="restart">Neu starten (neu gemischt)</button></div>
      </section>
      <div>${QUESTIONS.map((q, k) => `
        <details class="review-item ${isCorrect(k) ? 'ok' : 'nok'}">
          <summary><strong>${isCorrect(k) ? '✔' : '✘'} Frage ${q.n}</strong><span class="rq">${esc(q.q.split('\n')[0].slice(0, 110))}…</span>
            <span class="topic">${selected[k].length ? 'deine Antwort: ' + selected[k].map(i => letterOf(k, i)).sort().join(' + ') : 'keine Antwort'}</span></summary>
          <div class="review-body">${questionBodyHtml(k, true)}${explanationsHtml(k)}</div>
        </details>`).join('')}</div>`;
    document.getElementById('restart').addEventListener('click', () => location.reload());
    window.scrollTo(0, 0);
  }

  document.addEventListener('keydown', e => {
    if (finished) return;
    if (e.target instanceof Element && e.target.closest('input, textarea, select')) return;
    if (e.key === 'ArrowLeft') go(current - 1);
    if (e.key === 'ArrowRight') go(current + 1);
  });

  go(0);
})();
</script>
</body>
</html>

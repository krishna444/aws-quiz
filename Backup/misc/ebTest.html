            border-radius: 6px;

            transition: all 0.2s;
            font-size: 13px;
        }

            background-color: #e2e8f0;
        }

            background-color: var(--primary-light);
            color: white;
            border-color: var(--primary-light);
        }

            background-color: var(--card-bg);
            border-left: 4px solid var(--primary-light);
            padding: 20px;
            border-radius: 0 8px 8px 0;

            font-size: 14px;

            background-color: #f0fff4;
        }

        .question-card.status-incorrect {
            border-color: var(--incorrect-border);
            background-color: #fff5f5;
        }

            font-weight: bold;
            font-size: 16px;
            margin-bottom: 15px;
            color: var(--primary);
        }

            list-style: none;
            padding: 0;
            margin: 0 0 15px 0;
        }

        .option-item {
            margin-bottom: 8px;
        }

        .option-label {
            display: flex;
            align-items: flex-start;
            padding: 10px;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            cursor: pointer;
            background-color: white;
            transition: background-color 0.2s;
        }

        .option-label:hover {
            background-color: #f7fafc;
        }

            margin-right: 12px;
            margin-top: 3px;
            flex-shrink: 0;

            background-color: var(--correct-bg);
            border-color: var(--correct-border);
        }

            background-color: var(--incorrect-bg);
            border-color: var(--incorrect-border);
        }

            background-color: var(--correct-bg);
            border-color: var(--correct-border);
        }

            background-color: var(--primary);
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-submit:hover {
            background-color: var(--primary-light);
        }

        .btn-submit:disabled {
            background-color: #a0aec0;
            cursor: not-allowed;
        }

        .btn-reset {
            background-color: #e53e3e;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;

            display: none;
            margin-top: 15px;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid var(--explanation-border);
            background-color: var(--explanation-bg);

            border-color: var(--incorrect-border);
            background-color: var(--incorrect-bg);

            font-size: 13px;
            color: #718096;
            margin-top: 8px;
        }

            body { padding: 10px; }
            .cat-btn { font-size: 12px; padding: 6px 10px; }

        description: "Um die heutige Verfassung und die besondere Verantwortung Deutschlands zu verstehen, braucht man einen Überblick über die Geschichte des 20. Jahrhunderts. Nach dem Ersten Weltkrieg entstand 1919 die Weimarer Republik – die erste umfassende Demokratie auf deutschem Boden. Sie scheiterte unter dem Druck von Wirtschaftskrise, politischer Zersplitterung und der Ablehnung der Demokratie durch Teile der Eliten und der Bevölkerung.\n\nAm 30. Januar 1933 wurde Adolf Hitler zum Reichskanzler ernannt. Die Nationalsozialisten verwandelten die Demokratie innerhalb kurzer Zeit in eine Diktatur. Der Holocaust (die Shoah) war die systematische Ermordung von etwa sechs Millionen europäischen Jüdinnen und Juden. Am 9. November 1938 (Novemberpogrome) wurden Synagogen und jüdische Geschäfte zerstört. Der Zweite Weltkrieg in Europa endete mit der bedingungslosen Kapitulation Deutschlands am 8. Mai 1945.\n\nNach 1945 wurde Deutschland in vier Besatzungszonen aufgeteilt. 1949 entstanden zwei Staaten: die Bundesrepublik Deutschland (West) und die Deutsche Demokratische Republik (Ost). 1961 baute die DDR die Berliner Mauer. Am 9. November 1989 fiel die Berliner Mauer. Am 3. Oktober 1990 trat die DDR der Bundesrepublik bei – das ist der Tag der Deutschen Einheit.\n\nDeutschland hat neun Nachbarländer. Der erste Bundeskanzler der Bundesrepublik war Konrad Adenauer. Wegen der Verbrechen des Holocaust trägt Deutschland eine besondere historische Verantwortung gegenüber dem jüdischen Volk und dem Staat Israel. Holocaustleugnung ist in Deutschland strafbar.",

            { qId: "15b", text: "Was gab es in Deutschland nicht während der Zeit des Nationalsozialismus?", options: { a: "Verfolgung der Juden", b: "freie Wahlen", c: "Pressezensur", d: "willkürliche Verhaftungen" }, correct: "b", explanation: "Im NS-Regime gab es keine freien Wahlen." },
            { qId: "16b", text: "Die Nationalsozialisten mit Adolf Hitler errichteten 1933 in Deutschland …", options: { a: "ein Fürstentum.", b: "einen demokratischen Staat.", c: "eine Diktatur.", d: "eine Monarchie." }, correct: "c", explanation: "Die Nationalsozialisten errichteten eine Diktatur." },
            { qId: "18a", text: "Bei welchen Demonstrationen in Deutschland riefen die Menschen „Wir sind das Volk“?", options: { a: "bei den Demonstrationen 1968 in der Bundesrepublik Deutschland", b: "bei den Montagsdemonstrationen 1989 in der DDR", c: "beim Arbeiteraufstand 1953 in der DDR", d: "bei den Anti-Atomkraft-Demonstrationen 1985 in der Bundesrepublik Deutschland" }, correct: "b", explanation: "„Wir sind das Volk“ war der Ruf der Montagsdemonstrationen 1989." },
            { qId: "18b", text: "Soziale Marktwirtschaft bedeutet, die Wirtschaft …", options: { a: "wird vom Staat geplant und gesteuert, Angebot und Nachfrage werden nicht berücksichtigt.", b: "richtet sich nach der Nachfrage im Ausland.", c: "richtet sich nach Angebot und Nachfrage, aber der Staat sorgt für einen sozialen Ausgleich.", d: "steuert sich allein nach Angebot und Nachfrage." }, correct: "c", explanation: "Soziale Marktwirtschaft verbindet Markt mit sozialem Ausgleich." },
            { qId: "19a", text: "Welche Länder wurden nach dem Zweiten Weltkrieg in Deutschland als „Alliierte Besatzungsmächte“ bezeichnet?", options: { a: "Frankreich, Sowjetunion, Italien, Japan", b: "USA, Sowjetunion, Spanien, Portugal", c: "USA, Sowjetunion, Großbritannien, Frankreich", d: "Sowjetunion, Großbritannien, Polen, Schweden" }, correct: "c", explanation: "Die vier Alliierten waren USA, Sowjetunion, Großbritannien und Frankreich." },
            { qId: "19b", text: "Wer entscheidet, ob ein Kind in Deutschland in den Kindergarten geht?", options: { a: "die Bundesländer", b: "die Schulen", c: "der Staat", d: "die Eltern/die Erziehungsberechtigten" }, correct: "d", explanation: "Die Eltern entscheiden über den Kindergartenbesuch." },
            { qId: "20a", text: "Welches Land war keine „Alliierte Besatzungsmacht“ in Deutschland?", options: { a: "Sowjetunion", b: "Japan", c: "USA", d: "Frankreich" }, correct: "b", explanation: "Japan war keine Besatzungsmacht in Deutschland." },
            { qId: "20b", text: "Womit kann man in der Bundesrepublik Deutschland geehrt werden, wenn man auf politischem, wirtschaftlichem, kulturellem, geistigem oder sozialem Gebiet eine besondere Leistung erbracht hat? Mit dem …", options: { a: "Bundesadler", b: "Ehrentitel „Held der Deutschen Demokratischen Republik“", c: "Bundesverdienstkreuz", d: "Vaterländischen Verdienstorden" }, correct: "c", explanation: "Das Bundesverdienstkreuz ist die höchste Auszeichnung der Bundesrepublik." },
            { qId: "21a", text: "In Deutschland …", options: { a: "kann man mehrere Ehepartnerinnen/Ehepartner gleichzeitig haben.", b: "darf man zur gleichen Zeit nur mit einer Partnerin/einem Partner verheiratet sein.", c: "darf eine Frau nicht wieder heiraten, wenn ihr Mann gestorben ist.", d: "darf man nicht wieder heiraten, wenn man einmal verheiratet war." }, correct: "b", explanation: "In Deutschland gilt die Einehe (Monogamie)." },
            { qId: "22c", text: "Eine Frau ist schwanger. Sie ist kurz vor und nach der Geburt ihres Kindes vom Gesetz besonders beschützt. Wie heißt dieser Schutz?", options: { a: "Geburtsvorbereitung", b: "Elternzeit", c: "Wochenbett", d: "Mutterschutz" }, correct: "d", explanation: "Der besondere Schutz heißt Mutterschutz." },
            { qId: "23a", text: "Welchen Schulabschluss braucht man normalerweise, um an einer Universität in Deutschland ein Studium zu beginnen?", options: { a: "das Abitur", b: "die Prokura", c: "eine Gesellenprüfung", d: "ein Diplom" }, correct: "a", explanation: "Für ein Universitätsstudium braucht man in der Regel das Abitur." },
            { qId: "24a", text: "Wie viele Besatzungszonen gab es in Deutschland nach dem Zweiten Weltkrieg?", options: { a: "3", b: "4", c: "5", d: "6" }, correct: "b", explanation: "Es gab vier Besatzungszonen." },
            { qId: "25a", text: "Eine Frau in Deutschland verliert ihre Arbeit. Was darf nicht der Grund für diese Entlassung sein?", options: { a: "Die Frau kam oft zu spät zur Arbeit.", b: "Die Frau bekommt ein Kind und ihr Chef weiß das.", c: "Die Frau ist lange krank und arbeitsunfähig.", d: "Die Frau erledigt private Sachen während der Arbeitszeit." }, correct: "b", explanation: "Eine Kündigung wegen Schwangerschaft ist unzulässig." },
            { qId: "25b", text: "In Deutschland dürfen Ehepaare sich scheiden lassen. Meistens müssen sie dazu das „Trennungsjahr“ einhalten. Was bedeutet das?", options: { a: "Die Ehegatten sind ein Jahr verheiratet, dann ist die Scheidung möglich.", b: "Der Scheidungsprozess dauert ein Jahr.", c: "Die Ehegatten führen mindestens ein Jahr getrennt ihr eigenes Leben. Danach ist die Scheidung möglich.", d: "Das Besuchsrecht für die Kinder gilt ein Jahr." }, correct: "c", explanation: "Das Trennungsjahr bedeutet mindestens ein Jahr getrennten Lebens." },
            { qId: "25c", text: "Welche deutsche Stadt wurde nach dem Zweiten Weltkrieg in vier Sektoren aufgeteilt?", options: { a: "Dresden", b: "München", c: "Frankfurt/Oder", d: "Berlin" }, correct: "d", explanation: "Berlin wurde in vier Sektoren aufgeteilt." },
            { qId: "26b", text: "Ein Ehepaar möchte in Deutschland ein Restaurant eröffnen. Was braucht es dazu unbedingt?", options: { a: "eine Genehmigung des Einwohnermeldeamts", b: "eine Genehmigung einer Partei", c: "eine Erlaubnis der Polizei", d: "eine Gaststättenerlaubnis von der zuständigen Behörde" }, correct: "d", explanation: "Für ein Restaurant braucht man eine Gaststättenerlaubnis." },
            { qId: "27a", text: "Vom Juni 1948 bis zum Mai 1949 wurden die Bürgerinnen und Bürger von West-Berlin durch eine Luftbrücke versorgt. Welcher Umstand war dafür verantwortlich?", options: { a: "Für Großbritannien war die Versorgung über die Luftbrücke schneller.", b: "Für Frankreich war eine Versorgung der West-Berliner Bevölkerung mit dem Flugzeug kostengünstiger.", c: "Die Sowjetunion unterbrach den gesamten Verkehr auf dem Landwege.", d: "Die amerikanischen Soldaten/Soldatinnen hatten beim Landtransport Angst vor Überfällen." }, correct: "c", explanation: "Die Sowjetunion blockierte den Landweg (Berlin-Blockade)." },
            { qId: "29a", text: "Viele Menschen in Deutschland arbeiten in ihrer Freizeit ehrenamtlich. Was bedeutet das?", options: { a: "Sie arbeiten in der Bundesregierung.", b: "Sie arbeiten in einem Krankenhaus und verdienen dabei Geld.", c: "Sie arbeiten freiwillig und unbezahlt in Vereinen und Verbänden.", d: "Sie arbeiten als Soldatinnen/Soldaten." }, correct: "c", explanation: "Ehrenamt bedeutet freiwillige und unbezahlte Tätigkeit." },
            { qId: "29b", text: "Was wollte Willy Brandt mit seinem Kniefall 1970 im ehemaligen jüdischen Ghetto in Warschau ausdrücken?", options: { a: "Er sprach ein Gebet am Grab des Unbekannten Soldaten", b: "Er zeigte seine Demut vor dem Warschauer Pakt", c: "Er hat sich den ehemaligen Alliierten unterworfen", d: "Er bat Polen und die polnischen Juden um Vergebung" }, correct: "d", explanation: "Der Kniefall war eine Geste der Demut und Bitte um Vergebung." },
            { qId: "29c", text: "Welches Ehrenamt müssen deutsche Staatsbürgerinnen und Staatsbürger übernehmen, wenn sie dazu aufgefordert werden?", options: { a: "Bibliotheksaufsicht", b: "Vereinstrainerin/Vereinstrainer", c: "Lehrerin/Lehrer", d: "Wahlhelferin/Wahlhelfer" }, correct: "d", explanation: "Das Amt des Wahlhelfers ist ein Pflicht-Ehrenamt." },
            { qId: "30a", text: "Bei Erziehungsproblemen können Eltern in Deutschland Hilfe erhalten vom …", options: { a: "Ordnungsamt.", b: "Jugendamt.", c: "Schulamt.", d: "Gesundheitsamt." }, correct: "b", explanation: "Das Jugendamt hilft bei Erziehungsproblemen." },
            { qId: "31a", text: "2007 wurde das 50-jährige Jubiläum der „Römischen Verträge“ gefeiert. Was war der Inhalt der Verträge?", options: { a: "Gründung der Europäischen Wirtschaftsgemeinschaft (EWG)", b: "Festlegung der Oder-Neiße-Linie als Ostgrenze", c: "Beitritt Deutschlands zur NATO", d: "Verpflichtung Deutschlands zu Reparationsleistungen" }, correct: "a", explanation: "Die Römischen Verträge gründeten die EWG." },
            { qId: "31b", text: "Wann war in der Bundesrepublik Deutschland das „Wirtschaftswunder“?", options: { a: "80er Jahre", b: "70er Jahre", c: "50er Jahre", d: "40er Jahre" }, correct: "c", explanation: "Das Wirtschaftswunder fand in den 1950er Jahren statt." },
            { qId: "33a", text: "Eine erwachsene Frau möchte in Deutschland das Abitur nachholen. Das kann sie an …", options: { a: "einer Privatuniversität", b: "einem Abendgymnasium", c: "einer Hauptschule", d: "einer Hochschule." }, correct: "b", explanation: "Das Abitur kann man am Abendgymnasium nachholen." },
            { qId: "33b", text: "Wofür stand der Ausdruck „Eiserner Vorhang“? Für die Abschottung …", options: { a: "Nazi-Deutschlands gegen die Alliierten", b: "Europas gegen die USA", c: "Norddeutschlands gegen Süddeutschland", d: "des Warschauer Pakts gegen den Westen" }, correct: "d", explanation: "Der Eiserne Vorhang trennte den Osten vom Westen." },
            { qId: "34a", text: "Im Jahr 1953 gab es in der DDR einen Aufstand, an den lange Zeit in der Bundesrepublik Deutschland ein Feiertag erinnerte. Wann war das?", options: { a: "9. November", b: "20. Juli", c: "17. Juni", d: "1. Mai" }, correct: "c", explanation: "Der Aufstand war am 17. Juni 1953." },
            { qId: "34b", text: "Was man für die Arbeit können muss, ändert sich in Zukunft sehr schnell. Was kann man tun?", options: { a: "Kinder lernen in der Schule alles, was im Beruf wichtig ist. Nach der Schule muss man nicht weiter lernen.", b: "Alle müssen früher aufhören zu arbeiten, weil sich alles ändert.", c: "Es ist egal, was man lernt.", d: "Erwachsene müssen auch nach der Ausbildung immer weiter lernen." }, correct: "d", explanation: "Lebenslanges Lernen ist wichtig." },
            { qId: "35", text: "Welcher deutsche Staat hatte eine schwarz-rot-goldene Flagge mit Hammer, Zirkel und Ährenkranz?", options: { a: "DDR", b: "Drittes Reich", c: "Preußen", d: "Bundesrepublik Deutschland" }, correct: "a", explanation: "Das war die Flagge der DDR." },
            { qId: "36a", text: "Wahlen in Deutschland sind frei. Was bedeutet das?", options: { a: "Alle wahlberechtigten Personen müssen wählen.", b: "Man darf Geld annehmen, wenn man dafür einen bestimmten Kandidaten/eine bestimmte Kandidatin wählt.", c: "Der Wähler darf bei der Wahl weder beeinflusst noch zu einer bestimmten Stimmabgabe gezwungen werden und keine Nachteile durch die Wahl haben.", d: "Nur Personen, die noch nie im Gefängnis waren, dürfen wählen." }, correct: "c", explanation: "Frei bedeutet ohne Zwang und ohne Nachteile." },
            { qId: "37a", text: "Frau Frost arbeitet als fest angestellte Mitarbeiterin in einem Büro. Was muss sie nicht von ihrem Gehalt bezahlen?", options: { a: "Beiträge zur Arbeitslosenversicherung", b: "Beiträge zur Renten- und Krankenversicherung", c: "Umsatzsteuer", d: "Lohnsteuer" }, correct: "c", explanation: "Umsatzsteuer wird nicht vom Gehalt abgezogen." },
            { qId: "38", text: "In Deutschland hat man die besten Chancen auf einen gut bezahlten Arbeitsplatz, wenn man …", options: { a: "eine Frau ist.", b: "katholisch ist.", c: "Mitglied einer Partei ist.", d: "gut ausgebildet ist." }, correct: "d", explanation: "Gute Ausbildung verbessert die Chancen auf dem Arbeitsmarkt." },
            { qId: "39a", text: "Durch welche Verträge schloss sich die Bundesrepublik Deutschland mit anderen Staaten zur Europäischen Wirtschaftsgemeinschaft zusammen?", options: { a: "durch die „Pariser Verträge“", b: "durch die „Hamburger Verträge“", c: "durch die „Römischen Verträge“", d: "durch die „Londoner Verträge“" }, correct: "c", explanation: "Die Römischen Verträge gründeten die EWG." },
            { qId: "39b", text: "Im Parlament steht der Begriff „Opposition“ für …", options: { a: "alle Abgeordneten, die nicht zu der Regierungspartei/den Regierungsparteien gehören.", b: "die regierenden Parteien.", c: "alle Parteien, die bei der letzten Wahl die 5 %-Hürde erreichen konnten.", d: "die Fraktion mit den meisten Abgeordneten." }, correct: "a", explanation: "Die Opposition sind die Abgeordneten, die nicht zur Regierung gehören." },
            { qId: "41a", text: "Welche Organisation in einer Firma hilft den Arbeitnehmern und Arbeitnehmerinnen bei Problemen mit der Arbeitgeberin/dem Arbeitgeber?", options: { a: "der Betriebsprüfer/die Betriebsprüferin", b: "das Betriebsmanagement", c: "der Betriebsrat", d: "die Betriebsgruppe" }, correct: "c", explanation: "Der Betriebsrat vertritt die Interessen der Arbeitnehmer." },
            { qId: "42a", text: "Was darf das Jugendamt in Deutschland?", options: { a: "Es kontrolliert, ob das Kind einen Kindergarten besucht.", b: "Es kann ein Kind, das geschlagen wird oder hungern muss, aus der Familie nehmen.", c: "Es bezahlt das Kindergeld an die Eltern.", d: "Es entscheidet, welche Schule das Kind besucht." }, correct: "b", explanation: "Das Jugendamt kann bei Gefahr für das Kindeswohl eingreifen." },
            { qId: "44a", text: "Das Berufsinformationszentrum BIZ bei der Bundesagentur für Arbeit in Deutschland hilft bei der …", options: { a: "Lehrstellensuche", b: "Steuererklärung", c: "Rentenberechnung", d: "Krankenversicherung" }, correct: "a", explanation: "Das BIZ hilft bei der Berufs- und Lehrstellensuche." },
            { qId: "45a", text: "Sie möchten bei einer Firma in Deutschland Ihr Arbeitsverhältnis beenden. Was müssen Sie beachten?", options: { a: "die Kündigungsfrist", b: "die Versicherungspflicht", c: "die Gehaltszahlungen", d: "die Arbeitszeit" }, correct: "a", explanation: "Bei einer Kündigung muss die Kündigungsfrist beachtet werden." },
            { qId: "46a", text: "Aus welchem Land sind die meisten Migranten und Migrantinnen nach Deutschland gekommen?", options: { a: "Italien", b: "Türkei", c: "Polen", d: "Marokko" }, correct: "b", explanation: "Die meisten Migranten kamen aus der Türkei." },
            { qId: "47a", text: "Die Zusammenarbeit von Parteien zur Bildung einer Regierung nennt man in Deutschland …", options: { a: "Ministerium.", b: "Koalition.", c: "Fraktion.", d: "Einheit." }, correct: "b", explanation: "Eine Koalition ist die Zusammenarbeit von Parteien zur Regierungsbildung." },
            { qId: "48a", text: "Was kann ich in Deutschland machen, wenn mir meine Arbeitgeberin/mein Arbeitgeber zu Unrecht gekündigt hat?", options: { a: "Kündigungsschutzklage erheben", b: "die Arbeitgeberin/den Arbeitgeber bei der Polizei anzeigen", c: "weiterarbeiten und freundlich zur Chefin/zum Chef sein", d: "ein Mahnverfahren gegen den Arbeitgeber/die Arbeitgeberin führen" }, correct: "a", explanation: "Gegen ungerechtfertigte Kündigung kann man Kündigungsschutzklage erheben." },
            { qId: "48b", text: "Welches heutige deutsche Bundesland gehörte früher zum Gebiet der DDR?", options: { a: "Hessen", b: "Saarland", c: "Brandenburg", d: "Bayern" }, correct: "c", explanation: "Brandenburg gehörte zur DDR." },
            { qId: "50a", text: "Ein Mann möchte mit 30 Jahren in Deutschland sein Abitur nachholen. Wo kann er das tun? An …", options: { a: "einer Hauptschule", b: "einem Abendgymnasium", c: "einer Hochschule", d: "einer Privatuniversität" }, correct: "b", explanation: "Das Abitur kann am Abendgymnasium nachgeholt werden." },
            { qId: "51a", text: "In Deutschland dürfen Menschen offen etwas gegen die Regierung sagen, weil?", options: { a: "hier Meinungsfreiheit gilt.", b: "die Menschen das Wahlrecht haben.", c: "hier Religionsfreiheit gilt.", d: "die Menschen Steuern zahlen." }, correct: "a", explanation: "Die Meinungsfreiheit erlaubt Kritik an der Regierung." },
            { qId: "51b", text: "Wann kommt es in Deutschland zu einem Prozess vor Gericht? Wenn jemand …", options: { a: "eine andere Meinung als die der Regierung vertritt", b: "sein Auto falsch geparkt hat und es abgeschleppt wird", c: "zu einer anderen Religion übertritt", d: "eine Straftat begangen hat und angeklagt wird" }, correct: "d", explanation: "Ein Strafprozess findet statt, wenn jemand einer Straftat angeklagt wird." },
            { qId: "52a", text: "Ausländische Arbeitnehmer und Arbeitnehmerinnen, die in den 50er und 60er Jahren von der Bundesrepublik Deutschland angeworben wurden, nannte man …", options: { a: "Gastarbeiter/Gastarbeiterinnen", b: "Zeitarbeiter/Zeitarbeiterinnen", c: "Schwarzarbeiter/Schwarzarbeiterinnen", d: "Schichtarbeiter/Schichtarbeiterinnen" }, correct: "a", explanation: "Sie wurden Gastarbeiter genannt." },
            { qId: "53a", text: "In Deutschland sind Jugendliche ab 14 Jahren strafmündig. Das bedeutet: Jugendliche, die 14 Jahre und älter sind und gegen Strafgesetze verstoßen, …", options: { a: "werden bestraft.", b: "teilen die Strafe mit ihren Eltern.", c: "werden wie Erwachsene behandelt.", d: "werden nicht bestraft." }, correct: "a", explanation: "Ab 14 Jahren sind Jugendliche strafmündig." },
            { qId: "53b", text: "Wie werden die Regierungschefinnen/Regierungschefs der meisten Bundesländer in Deutschland genannt?", options: { a: "Senator/Senatorin", b: "Erster Minister/Erste Ministerin", c: "Premierminister/Premierministerin", d: "Ministerpräsident/Ministerpräsidentin" }, correct: "d", explanation: "In den meisten Ländern heißt der Regierungschef Ministerpräsident." },
            { qId: "55a", text: "Aus welchem Land kamen die ersten Gastarbeiter und Gastarbeiterinnen nach Deutschland?", options: { a: "Italien", b: "Portugal", c: "Türkei", d: "Spanien" }, correct: "a", explanation: "Die ersten Gastarbeiter kamen aus Italien." },
            { qId: "55b", text: "Welche Hauptaufgabe hat die deutsche Bundespräsidentin/der deutsche Bundespräsident? Sie/Er …", options: { a: "repräsentiert das Land.", b: "regiert das Land.", c: "überwacht die Einhaltung der Gesetze.", d: "entwirft die Gesetze" }, correct: "a", explanation: "Der Bundespräsident repräsentiert das Land." },
            { qId: "56a", text: "Was ist die Hauptaufgabe einer Richterin/eines Richters in Deutschland? Eine Richterin/ein Richter …", options: { a: "ändert Gesetze", b: "betreut Jugendliche vor Gericht", c: "vertritt Bürger und Bürgerinnen vor einem Gericht", d: "arbeitet an einem Gericht und spricht Urteile" }, correct: "d", explanation: "Richter sprechen Urteile." },
            { qId: "57a", text: "Eine junge Frau in Deutschland, 22 Jahre alt, lebt mit ihrem Freund zusammen. Die Eltern der Frau finden das nicht gut, weil ihnen der Freund nicht gefällt. Was können die Eltern tun?", options: { a: "Sie können zur Polizei gehen und die Tochter anzeigen.", b: "Sie haben das Recht, die Tochter in die elterliche Wohnung zurückzuholen.", c: "Sie suchen einen anderen Mann für die Tochter.", d: "Sie müssen die Entscheidung der volljährigen Tochter respektieren." }, correct: "d", explanation: "Volljährige entscheiden selbst über ihr Zusammenleben." },
            { qId: "60a", text: "Ein Richter/eine Richterin in Deutschland gehört zur …", options: { a: "Operative", b: "Exekutive.", c: "Judikative", d: "Legislative" }, correct: "c", explanation: "Richter gehören zur Judikative." },
            { qId: "60b", text: "In Deutschland können Eltern bis zum 14. Lebensjahr ihres Kindes entscheiden, ob es in der Schule am …", options: { a: "Religionsunterricht teilnimmt", b: "Politikunterricht teilnimmt.", c: "Geschichtsunterricht teilnimmt.", d: "Sprachunterricht teilnimmt." }, correct: "a", explanation: "Bis 14 Jahre entscheiden die Eltern über den Religionsunterricht." },
            { qId: "61a", text: "Eine junge Frau will den Führerschein machen. Sie hat Angst vor der Prüfung, weil ihre Muttersprache nicht Deutsch ist. Was ist richtig?", options: { a: "Wenn sie kein Deutsch kann, darf sie keinen Führerschein haben.", b: "Sie muss den Führerschein in dem Land machen, in dem man ihre Sprache spricht.", c: "Sie kann die Theorie-Prüfung vielleicht in ihrer Muttersprache machen. Es gibt mehr als zehn Sprachen zur Auswahl.", d: "Sie muss mindestens zehn Jahre in Deutschland leben, bevor sie den Führerschein machen kann." }, correct: "c", explanation: "Die Theorieprüfung kann in mehreren Sprachen abgelegt werden." },
            { qId: "62a", text: "Warum gibt es in einer Demokratie mehr als eine Partei?", options: { a: "damit Bestechung in der Politik begrenzt wird", b: "um wirtschaftlichen Wettbewerb anzuregen", c: "um politische Demonstrationen zu verhindern", d: "weil dadurch die unterschiedlichen Meinungen der Bürger und Bürgerinnen vertreten werden" }, correct: "d", explanation: "Mehrere Parteien ermöglichen die Vertretung unterschiedlicher Meinungen." },
            { qId: "62b", text: "Warum muss man in Deutschland bei der Steuererklärung aufschreiben, ob man zu einer Kirche gehört oder nicht? Weil …", options: { a: "die Kirche für die Steuererklärung verantwortlich ist.", b: "das für die Statistik in Deutschland wichtig ist.", c: "man mehr Steuern zahlen muss, wenn man nicht zu einer Kirche gehört.", d: "es eine Kirchensteuer gibt, die an die Einkommen- und Lohnsteuer geknüpft ist." }, correct: "d", explanation: "Die Kirchensteuer ist an die Einkommenssteuer gekoppelt." },
            { qId: "63a", text: "Welches heutige deutsche Bundesland gehörte früher zum Gebiet der DDR?", options: { a: "Saarland", b: "Nordrhein-Westfalen", c: "Hessen", d: "Sachsen-Anhalt" }, correct: "d", explanation: "Sachsen-Anhalt gehörte zur DDR." },
            { qId: "64a", text: "In Deutschland haben Kinder ab dem Alter von drei Jahren bis zur Ersteinschulung einen Anspruch auf …", options: { a: "einen Platz in einem Sportverein.", b: "einen Kindergartenplatz.", c: "monatliches Taschengeld.", d: "einen Ferienpass." }, correct: "b", explanation: "Es gibt einen Rechtsanspruch auf einen Kindergartenplatz." },
            { qId: "65a", text: "Deutschland ist ein Rechtsstaat. Was ist damit gemeint?", options: { a: "Die Gerichte machen die Gesetze.", b: "Nur Deutsche müssen die Gesetze befolgen.", c: "Alle Einwohner/Einwohnerinnen und der Staat müssen sich an die Gesetze halten.", d: "Der Staat muss sich nicht an die Gesetze halten." }, correct: "c", explanation: "Im Rechtsstaat sind alle – auch der Staat – an das Recht gebunden." },
            { qId: "65b", text: "Die Menschen in Deutschland leben nach dem Grundsatz der religiösen Toleranz. Was bedeutet das?", options: { a: "Jeder kann glauben, was er möchte.", b: "Alle Menschen glauben an Gott.", c: "Es dürfen keine Moscheen gebaut werden.", d: "Der Staat entscheidet, an welchen Gott die Menschen glauben." }, correct: "a", explanation: "Religiöse Toleranz bedeutet Glaubensfreiheit." },
            { qId: "66a", text: "In Deutschland wird die Staatsgewalt geteilt. Für welche Staatsgewalt arbeitet ein Richter/eine Richterin? Für die …", options: { a: "Legislative", b: "Judikative", c: "Exekutive", d: "Presse" }, correct: "b", explanation: "Richter arbeiten für die Judikative." },
            { qId: "66b", text: "Wer wählt in Deutschland die Bundespräsidentin/den Bundespräsidenten?", options: { a: "der Bundesrat", b: "das Bundesverfassungsgericht", c: "die Bundesversammlung", d: "das Bundesparlament" }, correct: "c", explanation: "Der Bundespräsident wird von der Bundesversammlung gewählt." },
            { qId: "69a", text: "Warum nennt man die Zeit im Herbst 1989 in der DDR „Die Wende“? In dieser Zeit veränderte sich die DDR politisch …", options: { a: "von einem religiösen Staat zu einem kommunistischen Staat.", b: "von einer Monarchie zur Sozialdemokratie", c: "von einer Diktatur zur Demokratie", d: "von einer liberalen Marktwirtschaft zum Sozialismus." }, correct: "c", explanation: "Die Wende brachte den Übergang von der Diktatur zur Demokratie." },
            { qId: "69b", text: "Welche Religion hat die europäische und deutsche Kultur geprägt?", options: { a: "das Christentum", b: "der Hinduismus", c: "der Buddhismus", d: "der Islam" }, correct: "a", explanation: "Das Christentum hat die europäische und deutsche Kultur stark geprägt." },
            { qId: "71a", text: "Was ist die Arbeit eines Richters/einer Richterin in Deutschland?", options: { a: "Recht sprechen", b: "Pläne erstellen", c: "Gesetze erlassen", d: "Deutschland regieren" }, correct: "a", explanation: "Richter sprechen Recht." },
            { qId: "74a", text: "Welches heutige deutsche Bundesland gehörte früher zum Gebiet der DDR?", options: { a: "Hessen", b: "Bayern", c: "Bremen", d: "Thüringen" }, correct: "d", explanation: "Thüringen gehörte zur DDR." },
            { qId: "75a", text: "Die parlamentarische Opposition im Deutschen Bundestag …", options: { a: "bestimmt, wer im Bundesrat sitzt.", b: "schlägt die Regierungschefs/Regierungschefinnen der Länder vor.", c: "kontrolliert die Regierung.", d: "entscheidet, wer Bundesminister/Bundesministerin wird." }, correct: "c", explanation: "Die Opposition kontrolliert die Regierung." },
            { qId: "78", text: "Welches heutige deutsche Bundesland gehörte früher zum Gebiet der DDR?", options: { a: "Baden-Württemberg", b: "Sachsen", c: "Bayern", d: "Niedersachsen" }, correct: "b", explanation: "Sachsen gehörte zur DDR." },
            { qId: "79", text: "Wen kann man als Bürgerin/Bürger in Deutschland nicht direkt wählen?", options: { a: "Landtagsabgeordnete", b: "Abgeordnete des EU-Parlaments", c: "den Bundespräsidenten/die Bundespräsidentin", d: "Bundestagsabgeordnete" }, correct: "c", explanation: "Der Bundespräsident wird nicht direkt vom Volk gewählt." },
            { qId: "80", text: "Wie nennt man in Deutschland die Vereinigung von Abgeordneten einer Partei im Parlament?", options: { a: "Fraktion", b: "Opposition", c: "Ältestenrat", d: "Verband" }, correct: "a", explanation: "Abgeordnete einer Partei bilden eine Fraktion." },
            { qId: "81", text: "Man will die Buslinie abschaffen, mit der Sie immer zur Arbeit fahren. Was können Sie machen, um die Buslinie zu erhalten?", options: { a: "Ich werde Mitglied in einem Sportverein und trainiere Rad fahren.", b: "Ich beteilige mich an einer Bürgerinitiative für die Erhaltung der Buslinie oder gründe selber eine Initiative.", c: "Ich schreibe einen Brief an das Forstamt der Gemeinde.", d: "Ich wende mich an das Finanzamt, weil ich als Steuerzahler / Steuerzahlerin ein Recht auf die Buslinie habe." }, correct: "b", explanation: "Bürgerinitiativen sind ein Mittel der politischen Beteiligung." },
            { qId: "82", text: "Welches Recht gehört zu den Grundrechten, die nach der deutschen Verfassung garantiert werden? Das Recht auf …", options: { a: "Arbeit", b: "Wohnung", c: "Glaubens- und Gewissensfreiheit", d: "Unterhaltung" }, correct: "c", explanation: "Glaubens- und Gewissensfreiheit ist ein Grundrecht." },
            { qId: "84", text: "Welches Organ gehört nicht zu den Verfassungsorganen Deutschlands?", options: { a: "die Regierung", b: "die Bürgerversammlung", c: "der Bundesrat", d: "die Bundespräsidentin/der Bundespräsident" }, correct: "b", explanation: "Eine Bürgerversammlung ist kein Verfassungsorgan." },
            { qId: "85", text: "Die deutschen Bundesländer wirken an der Gesetzgebung des Bundes mit durch …", options: { a: "den Bundestag.", b: "die Bundesregierung.", c: "den Bundesrat.", d: "die Bundesversammlung." }, correct: "c", explanation: "Die Länder wirken über den Bundesrat mit." },
            { qId: "87", text: "Maik und Sybille wollen mit Freunden an ihrem deutschen Wohnort eine Demonstration auf der Straße abhalten. Was müssen sie vorher tun?", options: { a: "Sie müssen die Demonstration anmelden.", b: "Maik und Sybille müssen einen neuen Verein gründen, weil nur Vereine demonstrieren dürfen", c: "Sie können gar nichts tun, denn Demonstrationen sind in Deutschland grundsätzlich verboten", d: "Sie müssen nichts tun. Man darf in Deutschland jederzeit überall demonstrieren." }, correct: "a", explanation: "Demonstrationen müssen angemeldet werden." },
            { qId: "89", text: "Welches heutige deutsche Bundesland gehörte früher zum Gebiet der DDR?", options: { a: "Saarland", b: "Schleswig-Holstein", c: "Hessen", d: "Mecklenburg-Vorpommern" }, correct: "d", explanation: "Mecklenburg-Vorpommern gehörte zur DDR." },
            { qId: "90", text: "In Deutschland kann ein Regierungswechsel in einem Bundesland Auswirkungen auf die Bundespolitik haben. Das Regieren wird …", options: { a: "leichter, wenn dadurch neue Parteien in den Bundesrat kommen.", b: "leichter, wenn es sich um ein reiches Bundesland handelt.", c: "schwieriger, wenn sich dadurch die Mehrheit im Bundestag ändert.", d: "schwieriger, wenn dadurch die Mehrheit im Bundesrat verändert wird." }, correct: "d", explanation: "Eine veränderte Mehrheit im Bundesrat kann die Bundespolitik erschweren." },
            { qId: "91", text: "Welches Grundrecht gilt in Deutschland nur für Ausländerinnen/Ausländer? Das Grundrecht auf …", options: { a: "Menschenwürde", b: "Meinungsfreiheit", c: "Schutz der Familie", d: "Asyl" }, correct: "d", explanation: "Das Asylrecht gilt für politisch Verfolgte (meist Ausländer)." },
            { qId: "95", text: "Welche der folgenden Auflistungen enthält nur Bundesländer, die zum Gebiet der früheren DDR gehörten?", options: { a: "Sachsen, Thüringen, Hessen, Niedersachsen, Brandenburg", b: "Bayern, Baden-Württemberg, Rheinland-Pfalz, Thüringen, Sachsen", c: "Niedersachsen, Nordrhein-Westfalen, Hessen, Schleswig-Holstein, Brandenburg", d: "Mecklenburg-Vorpommern, Brandenburg, Sachsen, Sachsen-Anhalt, Thüringen" }, correct: "d", explanation: "Das sind die fünf neuen Bundesländer der ehemaligen DDR." },
            { qId: "97", text: "Wohin muss man in Deutschland zuerst gehen, wenn man heiraten möchte?", options: { a: "zum Ordnungsamt", b: "zum Einwohnermeldeamt", c: "zum Standesamt", d: "zur Agentur für Arbeit" }, correct: "c", explanation: "Heiraten erfolgt beim Standesamt." },
            { qId: "98", text: "Je mehr „Zweitstimmen“ eine Partei bei einer Bundestagswahl bekommt, desto …", options: { a: "mehr Sitze erhält die Partei im Parlament.", b: "größer ist das Risiko, eine Koalition bilden zu müssen.", c: "weniger Erststimmen kann sie haben.", d: "mehr Direktkandidaten der Partei ziehen ins Parlament ein." }, correct: "a", explanation: "Die Zweitstimme entscheidet über die Sitzverteilung." },
            { qId: "101", text: "Eine Partei im Deutschen Bundestag will die Pressefreiheit abschaffen. Ist das möglich?", options: { a: "Nein, denn die Pressefreiheit ist ein Grundrecht. Sie kann nicht abgeschafft werden", b: "Nein, denn nur der Bundesrat kann die Pressefreiheit abschaffen.", c: "Ja, aber dazu müssen zwei Drittel der Abgeordneten im Bundestag dafür sein", d: "Ja, wenn mehr als die Hälfte der Abgeordneten im Bundestag dafür sind." }, correct: "a", explanation: "Grundrechte können nicht einfach abgeschafft werden." },
            { qId: "104", text: "Wer wird meistens zur Präsidentin/zum Präsidenten des Deutschen Bundestages gewählt?", options: { a: "ein ehemaliger Bundeskanzler/eine ehemalige Bundeskanzlerin", b: "eine Abgeordnete/ein Abgeordneter der stärksten Fraktion", c: "der/die älteste Abgeordnete im Parlament", d: "der Ministerpräsident/die Ministerpräsidentin des größten Bundeslandes" }, correct: "b", explanation: "Meist kommt der Bundestagspräsident aus der stärksten Fraktion." },
            { qId: "106", text: "Wenn Abgeordnete im Deutschen Bundestag ihre Fraktion wechseln, …", options: { a: "kann die Regierung ihre Mehrheit verlieren.", b: "muss der Bundespräsident/die Bundespräsidentin zuvor sein/ihr Einverständnis geben.", c: "dürfen die Wähler/Wählerinnen dieser Abgeordneten noch einmal wählen.", d: "dürfen sie nicht mehr an den Sitzungen des Parlaments teilnehmen" }, correct: "a", explanation: "Ein Fraktionswechsel kann die Mehrheitsverhältnisse verändern." },
            { qId: "107", text: "Wie wird die Verfassung der Bundesrepublik Deutschland genannt?", options: { a: "Verfassungsvertrag", b: "Gesetzbuch", c: "Grundgesetz", d: "Bundesverfassung" }, correct: "c", explanation: "Die Verfassung heißt Grundgesetz." },
            { qId: "108", text: "Was sollten Sie tun, wenn Sie von Ihrer Ansprechpartnerin / Ihrem Ansprechpartner in einer deutschen Behörde schlecht behandelt werden?", options: { a: "Ich drohe der Person.", b: "Ich kann nichts tun.", c: "Ich muss mir diese Behandlung gefallen lassen.", d: "Ich kann mich beim Behördenleiter/bei der Behördenleiterin beschweren." }, correct: "d", explanation: "Man kann sich beim Behördenleiter beschweren." },
            { qId: "109", text: "Wer ernennt in Deutschland die Ministerinnen/die Minister der Bundesregierung?", options: { a: "die Bundestagspräsidentin/der Bundestagspräsident", b: "der Präsident/die Präsidentin des Bundesverfassungsgerichtes", c: "der Bundesratspräsident/die Bundesratspräsidentin", d: "der Bundespräsident/die Bundespräsidentin" }, correct: "d", explanation: "Der Bundespräsident ernennt die Minister auf Vorschlag des Kanzlers." },
            { qId: "110", text: "Was wird in Deutschland als „Ampelkoalition“ bezeichnet? Die Zusammenarbeit …", options: { a: "von CSU, Die LINKE und Bündnis 90/Die Grünen in einer Regierung", b: "der Bundestagsfraktionen von CDU und SPD", c: "der Bundestagsfraktionen von CDU und CSU", d: "von SPD, FDP und Bündnis 90/Die Grünen in einer Regierung" }, correct: "d", explanation: "Ampelkoalition = SPD (rot), FDP (gelb), Grüne." },
            { qId: "111", text: "Wie wurden die Bundesrepublik Deutschland und die DDR zu einem Staat?", options: { a: "Die DDR hat die Bundesrepublik Deutschland besetzt.", b: "Die westlichen Bundesländer sind der DDR beigetreten.", c: "Die Bundesrepublik Deutschland hat die DDR besetzt.", d: "Die heutigen fünf östlichen Bundesländer sind der Bundesrepublik Deutschland beigetreten." }, correct: "d", explanation: "Die DDR trat der Bundesrepublik bei." },
            { qId: "112", text: "In den meisten Mietshäusern in Deutschland gibt es eine „Hausordnung“. Was steht in einer solchen „Hausordnung“? Sie nennt …", options: { a: "die Adresse des nächsten Ordnungsamtes.", b: "Regeln für die Benutzung öffentlicher Einrichtungen.", c: "alle Mieter und Mieterinnen im Haus.", d: "Regeln, an die sich alle Bewohner und Bewohnerinnen halten müssen." }, correct: "d", explanation: "Die Hausordnung enthält Regeln für die Bewohner." },
            { qId: "113", text: "Meinungsfreiheit in Deutschland heißt, dass ich …", options: { a: "meine Meinung in Leserbriefen äußern kann.", b: "Passanten auf der Straße beschimpfen darf.", c: "meine Meinung nur dann äußern darf, solange ich der Regierung nicht widerspreche.", d: "Nazi-, Hamas- oder Islamischer Staat-Symbole öffentlich tragen darf." }, correct: "a", explanation: "Meinungsfreiheit erlaubt die freie Äußerung der Meinung (innerhalb der gesetzlichen Grenzen)." },
            { qId: "114", text: "Auf welcher rechtlichen Grundlage wurde der Staat Israel gegründet?", options: { a: "eine Resolution der Vereinten Nationen", b: "ein Vorschlag der Bundesregierung", c: "ein Vorschlag der UdSSR", d: "ein Beschluss des Zionistenkongresses" }, correct: "a", explanation: "Israel wurde auf Grundlage einer UN-Resolution gegründet." },
            { qId: "115", text: "Was ist eine Aufgabe von Wahlhelferinnen/Wahlhelfern in Deutschland?", options: { a: "Sie geben Zwischenergebnisse an die Medien weiter.", b: "Sie helfen alten Menschen bei der Stimmabgabe in der Wahlkabine.", c: "Sie zählen die Stimmen nach dem Ende der Wahl.", d: "Sie schreiben die Wahlbenachrichtigungen vor der Wahl." }, correct: "c", explanation: "Wahlhelfer zählen die Stimmen aus." },
            { qId: "116", text: "Wenn Sie sich in Deutschland gegen einen falschen Steuerbescheid wehren wollen, müssen Sie …", options: { a: "Einspruch einlegen.", b: "den Bescheid wegwerfen.", c: "warten, bis ein anderer Bescheid kommt.", d: "nichts machen." }, correct: "a", explanation: "Gegen einen Steuerbescheid legt man Einspruch ein." },
            { qId: "117", text: "Mit dem Beitritt der DDR zur Bundesrepublik Deutschland gehören die neuen Bundesländer nun auch …", options: { a: "zur Europäischen Verteidigungsgemeinschaft.", b: "zum Warschauer Pakt.", c: "zur Europäischen Union.", d: "zur OPEC." }, correct: "c", explanation: "Mit der Wiedervereinigung wurden die neuen Länder Teil der EU." },
            { qId: "120", text: "In Deutschland helfen ehrenamtliche Wahlhelfer und Wahlhelferinnen bei den Wahlen. Was ist eine Aufgabe von Wahlhelfern/Wahlhelferinnen?", options: { a: "Sie schreiben Karten und Briefe mit der Angabe des Wahllokals.", b: "Sie geben Zwischenergebnisse an Journalisten weiter.", c: "Sie zählen die Stimmen nach dem Ende der Wahl.", d: "Sie helfen Kindern und alten Menschen beim Wählen." }, correct: "c", explanation: "Eine zentrale Aufgabe ist das Auszählen der Stimmen." },
            { qId: "121", text: "Was tun Sie, wenn Sie eine falsche Rechnung von einer deutschen Behörde bekommen?", options: { a: "Ich schicke die Rechnung an die Behörde zurück.", b: "Ich lasse die Rechnung liegen.", c: "Ich lege Widerspruch bei der Behörde ein.", d: "Ich gehe mit der Rechnung zum Finanzamt." }, correct: "c", explanation: "Gegen eine falsche Rechnung legt man Widerspruch ein." },
            { qId: "123", text: "Wann ist die Meinungsfreiheit in Deutschland eingeschränkt?", options: { a: "bei Kritik am Staat", b: "bei Meinungsäusserungen über die Bundesregierung", c: "bei der öffentlichen Verbreitung falscher Behauptungen über einzelne Personen", d: "bei Diskussionen über Religionen" }, correct: "c", explanation: "Falsche Behauptungen (z. B. Verleumdung) sind strafbar." },
            { qId: "125", text: "Wenn das Parlament eines deutschen Bundeslandes gewählt wird, nennt man das …", options: { a: "Europawahl.", b: "Landtagswahl.", c: "Bundestagswahl.", d: "Kommunalwahl." }, correct: "b", explanation: "Die Wahl des Landesparlaments heißt Landtagswahl." },
            { qId: "127", text: "Welche Städte haben die größten jüdischen Gemeinden in Deutschland?", options: { a: "Nürnberg und Stuttgart", b: "Berlin und München", c: "Hamburg und Essen", d: "Worms und Speyer" }, correct: "b", explanation: "Berlin und München haben die größten jüdischen Gemeinden." },
            { qId: "128", text: "Bei einer Bundestagswahl in Deutschland darf jeder wählen, die/der …", options: { a: "seit mindestens 3 Jahren in der Bundesrepublik Deutschland lebt.", b: "Bürger/Bürgerin der Bundesrepublik Deutschland ist und mindestens 21 Jahre alt ist.", c: "in der Bundesrepublik Deutschland wohnt und wählen möchte.", d: "Bürger/Bürgerin der Bundesrepublik Deutschland ist und mindestens 18 Jahre alt ist." }, correct: "d", explanation: "Wahlberechtigt sind deutsche Staatsbürger ab 18 Jahren." },
            { qId: "129", text: "Die deutschen Gesetze verbieten …", options: { a: "Ungleichbehandlung der Bürger und Bürgerinnen durch den Staat.", b: "Versammlungsfreiheit der Einwohner und Einwohnerinnen.", c: "Meinungsfreiheit der Einwohner und Einwohnerinnen.", d: "Petitionen der Bürger und Bürgerinnen." }, correct: "a", explanation: "Ungleichbehandlung durch den Staat ist verboten (Gleichheitsgrundsatz)." },
            { qId: "133", text: "Sie haben in Deutschland einen Fernseher gekauft. Zu Hause packen Sie den Fernseher aus, doch er funktioniert nicht. Der Fernseher ist kaputt. Was können Sie machen?", options: { a: "den Fernseher reklamieren", b: "eine Anzeige schreiben", c: "die Garantie verlängern", d: "das Gerät ungefragt austauschen" }, correct: "a", explanation: "Bei einem Mangel kann man reklamieren." },
            { qId: "134", text: "Welches Grundrecht ist in Artikel 1 des Grundgesetzes der Bundesrepublik Deutschland garantiert?", options: { a: "Religionsfreiheit", b: "die Unantastbarkeit der Menschenwürde", c: "das Recht auf Leben", d: "Meinungsfreiheit" }, correct: "b", explanation: "Artikel 1 garantiert die Unantastbarkeit der Menschenwürde." },
            { qId: "138", text: "Was versteht man unter dem Recht der „Freizügigkeit“ in Deutschland?", options: { a: "Man darf sich in der Öffentlichkeit nur leicht bekleidet bewegen.", b: "Man darf sich seinen Wohnort selbst aussuchen.", c: "Man kann seinen Beruf wechseln.", d: "Man darf sich für eine andere Religion entscheiden." }, correct: "b", explanation: "Freizügigkeit bedeutet die freie Wahl des Wohnorts." },
            { qId: "141", text: "Woraus begründet sich Deutschlands besondere Verantwortung für Israel?", options: { a: "aus dem Grundgesetz der Bundesrepublik Deutschland", b: "aus der Mitgliedschaft in der Europäischen Union (EU)", c: "aus den nationalsozialistischen Verbrechen gegen Juden", d: "aus der christlichen Tradition" }, correct: "c", explanation: "Die Verantwortung ergibt sich aus den NS-Verbrechen." },
            { qId: "142", text: "Eine Partei in Deutschland verfolgt das Ziel, eine Diktatur zu errichten. Sie ist dann …", options: { a: "verfassungswidrig.", b: "gesetzestreu.", c: "tolerant.", d: "rechtsstaatlich orientiert." }, correct: "a", explanation: "Eine solche Partei ist verfassungswidrig." },
            { qId: "144", text: "Was ist in Deutschland vor allem eine Aufgabe der Bundesländer?", options: { a: "Verteidigungspolitik", b: "Schulpolitik", c: "Außenpolitik", d: "Wirtschaftspolitik" }, correct: "b", explanation: "Schulpolitik ist Ländersache." },
            { qId: "146", text: "Was bedeutet in Deutschland der Grundsatz der Gleichbehandlung?", options: { a: "Niemand darf gegen Personen klagen, wenn sie benachteiligt wurden.", b: "Niemand darf z. B. wegen einer Behinderung benachteiligt werden.", c: "Es ist für alle Gesetz, benachteiligten Gruppen jährlich Geld zu spenden.", d: "Man darf andere Personen benachteiligen, wenn ausreichende persönliche Gründe hierfür vorliegen." }, correct: "b", explanation: "Niemand darf wegen bestimmter Merkmale benachteiligt werden." },
            { qId: "148", text: "Warum kontrolliert der Staat in Deutschland das Schulwesen?", options: { a: "weil es in den Bundesländern verschiedene Schulen gibt", b: "weil es in Deutschland nur staatliche Schulen gibt", c: "weil es nach dem Grundgesetz seine Aufgabe ist", d: "weil alle Schüler und Schülerinnen einen Schulabschluss haben müssen" }, correct: "c", explanation: "Das Schulwesen unterliegt der staatlichen Aufsicht nach dem Grundgesetz." },
            { qId: "150", text: "Sie haben in Deutschland absichtlich einen Brief geöffnet, der an eine andere Person adressiert ist. Was haben Sie nicht beachtet?", options: { a: "die Meinungsfreiheit", b: "die Schweigepflicht", c: "das Schweigerecht", d: "das Briefgeheimnis" }, correct: "d", explanation: "Das Briefgeheimnis schützt die Vertraulichkeit von Post." },
            { qId: "152", text: "Wahlen in Deutschland gewinnt die Partei, die …", options: { a: "die meisten Männer mehrheitlich gewählt haben.", b: "die meisten Stimmen bei den Arbeitern/Arbeiterinnen bekommen hat.", c: "die meisten Erststimmen für ihren Kanzlerkandidaten /ihre Kanzlerkandidatin erhalten hat.", d: "die meisten Stimmen bekommt." }, correct: "d", explanation: "Gewählt wird nach Stimmenanteil (Zweitstimmen)." },
            { qId: "153", text: "Die Bundesrepublik Deutschland hat einen dreistufigen Verwaltungsaufbau. Wie heißt die unterste politische Stufe?", options: { a: "Bezirksämter", b: "Gemeinden", c: "Stadträte", d: "Landräte" }, correct: "b", explanation: "Die unterste Stufe sind die Gemeinden." },
            { qId: "155", text: "Eine Frau, die ein zweijähriges Kind hat, bewirbt sich in Deutschland um eine Stelle. Was ist ein Beispiel für Diskriminierung? Sie bekommt die Stelle nur deshalb nicht, weil sie …", options: { a: "keine Erfahrungen in diesem Beruf hat.", b: "kein Englisch spricht.", c: "Mutter ist.", d: "zu hohe Gehaltsvorstellungen hat." }, correct: "c", explanation: "Eine Ablehnung wegen Mutterschaft ist Diskriminierung." },
            { qId: "157", text: "Die Bundesrepublik Deutschland ist ein demokratischer und sozialer …", options: { a: "Zentralstaat.", b: "Staatenverbund.", c: "Bundesstaat.", d: "Staatenbund." }, correct: "c", explanation: "Deutschland ist ein Bundesstaat." },
            { qId: "158", text: "Der deutsche Bundespräsident Gustav Heinemann gibt Helmut Schmidt 1974 die Ernennungsurkunde zum deutschen Bundeskanzler. Was gehört zu den Aufgaben der deutschen Bundespräsidentin/des deutschen Bundespräsidenten?", options: { a: "Er/Sie kontrolliert die Regierungspartei.", b: "Er/Sie schlägt den Kanzler/die Kanzlerin zur Wahl vor.", c: "Er/Sie führt die Regierungsgeschäfte.", d: "Er/Sie wählt die Minister/Ministerinnen aus." }, correct: "b", explanation: "Der Bundespräsident schlägt den Kanzler zur Wahl vor und ernennt ihn." },
            { qId: "160", text: "Ein Mann im Rollstuhl hat sich auf eine Stelle als Buchhalter beworben. Was ist ein Beispiel für Diskriminierung? Er bekommt die Stelle nur deshalb nicht, weil er …", options: { a: "zu hohe Gehaltsvorstellungen hat.", b: "keine Erfahrung hat.", c: "im Rollstuhl sitzt.", d: "kein Englisch spricht." }, correct: "c", explanation: "Ablehnung wegen einer Behinderung ist Diskriminierung." },
            { qId: "162", text: "Wo hält sich der deutsche Bundeskanzler/die deutsche Bundeskanzlerin am häufigsten auf? Am häufigsten ist er/sie …", options: { a: "auf Schloss Meseberg, dem Gästehaus der Bundesregierung, um Staatsgäste zu empfangen.", b: "in Berlin, weil sich dort das Bundeskanzleramt und der Bundestag befinden.", c: "auf Schloss Bellevue, dem Amtssitz der Bundespräsidentin/des Bundespräsidenten, um Staatsgäste zu empfangen.", d: "in Bonn, weil sich dort das Bundeskanzleramt und der Bundestag befinden." }, correct: "b", explanation: "Der Kanzler arbeitet vor allem in Berlin." },

// LocalStorage key
const STORAGE_KEY = 'einbuergerungstest_progress_v1';

// Load progress
function loadProgress() {
    try {
        const data = localStorage.getItem(STORAGE_KEY);
        return data ? JSON.parse(data) : {};
    } catch (e) {
        return {};
    }
}

// Save progress
function saveProgress(progress) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(progress));
}

// Get unique question key
function qKey(catId, qId) {
    return catId + '_' + qId;
}

let progress = loadProgress();
let currentCategoryId = null;

// Count totals
function countTotals() {
    let total = 0;
    quizData.forEach(cat => { total += cat.questions.length; });
    return total;
}

// Update stats bar
function updateStats() {
    let answered = 0, correct = 0, incorrect = 0;
    quizData.forEach(cat => {
        cat.questions.forEach(q => {
            const key = qKey(cat.id, q.qId);
            if (progress[key]) {
                answered++;
                if (progress[key].correct) correct++;
                else incorrect++;
            }
        });
    });
    document.getElementById('answered-count').textContent = answered;
    document.getElementById('total-count').textContent = countTotals();
    document.getElementById('correct-count').textContent = correct;
    document.getElementById('incorrect-count').textContent = incorrect;
}

// Render category buttons
function renderCategoryButtons() {
    const nav = document.getElementById('category-buttons');
    nav.innerHTML = '';
    quizData.forEach(cat => {
        const btn = document.createElement('button');
        btn.className = 'cat-btn' + (currentCategoryId === cat.id ? ' active' : '');
        btn.textContent = cat.title.split('.')[0] + '. ' + cat.title.split('. ')[1].split(' (')[0];
        if (cat.title.length > 40) btn.textContent = cat.title.substring(0, 35) + '…';
        btn.onclick = () => showCategory(cat.id);
        nav.appendChild(btn);
    });
}

// Show category
// Show category
function showCategory(catId) {
    const catIdNum = Number(catId);
    currentCategoryId = catIdNum;
    const cat = quizData.find(c => c.id === catIdNum);
    if (!cat) return;

    renderCategoryButtons();

    const overview = document.getElementById('chapter-overview-container');
    overview.style.display = 'block';
    overview.innerHTML = `
        <h2>${cat.title}</h2>
        <p style="white-space: pre-line;">${cat.description}</p>
        <div class="merkhilfe">${cat.merkhilfe}</div>
        <p class="progress-note">${cat.questions.length} Fragen in dieser Kategorie</p>
    `;

    const container = document.getElementById('questions-container');
    container.innerHTML = '';

    cat.questions.forEach((q, idx) => {
        const key = qKey(cat.id, q.qId);
        const saved = progress[key];
        const statusClass = saved ? (saved.correct ? 'status-correct' : 'status-incorrect') : '';

        const card = document.createElement('div');
        card.className = 'question-card ' + statusClass;
        card.id = 'qcard_' + key;

        let optionsHtml = '';
        ['a', 'b', 'c', 'd'].forEach(letter => {
            if (!q.options[letter]) return;
            let optClass = 'option-label';
            let checked = '';
            if (saved) {
                if (saved.selected === letter) {
                    optClass += saved.correct ? ' selected-correct' : ' selected-incorrect';
                    checked = 'checked';
                }
                if (letter === q.correct) {
                    optClass += ' show-correct';
                }
            }
            optionsHtml += `
                <li class="option-item">
                    <label class="${optClass}">
                        <input type="radio" name="q_${key}" value="${letter}" ${checked} ${saved ? 'disabled' : ''}>
                        <span><strong>${letter})</strong> ${q.options[letter]}</span>
                    </label>
                </li>
            `;
        });

        card.innerHTML = `
            <div class="question-header">[${q.qId}] ${q.text}</div>
            <ul class="options-list">${optionsHtml}</ul>
            ${!saved ? `<button class="btn-submit" onclick="submitAnswer('${cat.id}', '${q.qId}')">Antwort prüfen</button>` : ''}
            <div class="explanation-box">
                <strong>Richtige Antwort: ${q.correct.toUpperCase()}</strong><br>
                ${q.explanation}
            </div>
        `;
        container.appendChild(card);
    });

    updateStats();
    window.scrollTo({ top: 0, behavior: 'smooth' });
}
// Submit answer

// Submit answer

// Submit answer
function submitAnswer(catId, qId) {
    const catIdNum = Number(catId);
    const cat = quizData.find(c => c.id === catIdNum);
    if (!cat) {
        console.error('Category not found:', catId);
        return;
    }
    const q = cat.questions.find(x => String(x.qId) === String(qId));
    if (!q) {
        console.error('Question not found:', qId);
        return;
    }
    const key = qKey(catIdNum, q.qId);
    const radios = document.querySelectorAll(`input[name="q_${key}"]`);
    let selected = null;
    radios.forEach(r => { if (r.checked) selected = r.value; });

    if (!selected) {
        alert('Bitte wählen Sie eine Antwort aus.');
        return;
    }

    const isCorrect = selected === q.correct;
    progress[key] = { selected, correct: isCorrect };
    saveProgress(progress);

    // Update the card directly without calling showCategory() or scrolling
    const card = document.getElementById('qcard_' + key);
    if (card) {
        card.className = 'question-card ' + (isCorrect ? 'status-correct' : 'status-incorrect');
        
        // Update radio styles and disable them
        radios.forEach(r => {
            r.disabled = true;
            const label = r.closest('label');
            if (r.value === selected) {
                label.classList.add(isCorrect ? 'selected-correct' : 'selected-incorrect');
            }
            if (r.value === q.correct) {
                label.classList.add('show-correct');
            }
        });

        // Hide submit button
        const submitBtn = card.querySelector('.btn-submit');
        if (submitBtn) submitBtn.remove();
    }

    updateStats();
}

// Reset progress
function resetProgress() {
    if (confirm('Möchten Sie den gesamten Fortschritt wirklich zurücksetzen?')) {
        progress = {};
        saveProgress(progress);
        updateStats();
        if (currentCategoryId) showCategory(currentCategoryId);
        else {
            document.getElementById('chapter-overview-container').style.display = 'none';
            document.getElementById('questions-container').innerHTML = '';
        }
    }
}

// Init
document.addEventListener('DOMContentLoaded', () => {
    renderCategoryButtons();
    updateStats();
    // Auto-select first category
    if (quizData.length > 0) showCategory(1);
});
</script>
